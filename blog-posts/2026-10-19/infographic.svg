<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#FAFAF9;">

  <!-- Background -->
  <rect width="800" height="620" fill="#FAFAF9"/>

  <!-- Title area -->
  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Email Automation Audit: Volume Mode vs. Signal Mode</text>
  <text x="400" y="58" text-anchor="middle" font-size="12" fill="#475569">Where does your program live today?</text>

  <!-- Divider -->
  <line x1="40" y1="70" x2="760" y2="70" stroke="#E2E8F0" stroke-width="1"/>

  <!-- START BOX -->
  <rect x="300" y="88" width="200" height="48" rx="6" fill="#0F172A"/>
  <text x="400" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Your Email Program</text>
  <text x="400" y="126" text-anchor="middle" font-size="11" fill="#94A3B8">Start the audit here</text>

  <!-- Arrow down from start -->
  <line x1="400" y1="136" x2="400" y2="168" stroke="#0F172A" stroke-width="1.5"/>
  <polygon points="393,162 400,174 407,162" fill="#0F172A"/>

  <!-- QUESTION 1 DIAMOND -->
  <polygon points="400,178 520,228 400,278 280,228" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="400" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">Are sends triggered</text>
  <text x="400" y="239" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">by subscriber behavior?</text>

  <!-- NO branch (left) -->
  <line x1="280" y1="228" x2="180" y2="228" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="187,221 175,228 187,235" fill="#DC2626"/>
  <text x="229" y="220" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="600">NO</text>

  <!-- YES branch (right) -->
  <line x1="520" y1="228" x2="620" y2="228" stroke="#0F172A" stroke-width="1.5"/>
  <polygon points="613,221 625,228 613,235" fill="#0F172A"/>
  <text x="571" y="220" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="600">YES</text>

  <!-- VOLUME MODE box (left) -->
  <rect x="60" y="256" width="190" height="90" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="155" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">VOLUME MODE</text>
  <text x="155" y="297" text-anchor="middle" font-size="10" fill="#475569">Time-based drip sequences</text>
  <text x="155" y="312" text-anchor="middle" font-size="10" fill="#475569">Calendar-scheduled blasts</text>
  <text x="155" y="327" text-anchor="middle" font-size="10" fill="#475569">Segment-only targeting</text>

  <!-- Volume mode stats callout -->
  <rect x="60" y="360" width="190" height="60" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="155" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">$0.18 avg/send</text>
  <text x="155" y="396" text-anchor="middle" font-size="10" fill="#475569">~98% of sends in typical program</text>
  <text x="155" y="411" text-anchor="middle" font-size="10" fill="#475569">~60-70% of total email revenue</text>

  <!-- SIGNAL MODE box (right) -->
  <rect x="550" y="256" width="190" height="90" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
  <text x="645" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">SIGNAL MODE</text>
  <text x="645" y="297" text-anchor="middle" font-size="10" fill="#475569">Cart &amp; browse abandonment</text>
  <text x="645" y="312" text-anchor="middle" font-size="10" fill="#475569">Post-purchase &amp; win-back flows</text>
  <text x="645" y="327" text-anchor="middle" font-size="10" fill="#475569">Lifecycle event triggers</text>

  <!-- Signal mode stats callout -->
  <rect x="550" y="360" width="190" height="60" rx="4" fill="#F0F9FF" stroke="#0F172A" stroke-width="1"/>
  <text x="645" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">$2.87 avg/send</text>
  <text x="645" y="396" text-anchor="middle" font-size="10" fill="#475569">~2% of sends in typical program</text>
  <text x="645" y="411" text-anchor="middle" font-size="10" fill="#475569">30–37% of total email revenue</text>

  <!-- Arrows down from both boxes -->
  <line x1="155" y1="420" x2="155" y2="456" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="148,450 155,462 162,450" fill="#DC2626"/>
  <line x1="645" y1="420" x2="645" y2="456" stroke="#0F172A" stroke-width="1.5"/>
  <polygon points="638,450 645,462 652,450" fill="#0F172A"/>

  <!-- VOLUME outcome box -->
  <rect x="60" y="462" width="190" height="56" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="155" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">AI stack incompatibility</text>
  <text x="155" y="500" text-anchor="middle" font-size="10" fill="#475569">No behavioral data to feed</text>
  <text x="155" y="514" text-anchor="middle" font-size="10" fill="#475569">agentic AI personalization</text>

  <!-- SIGNAL outcome box -->
  <rect x="550" y="462" width="190" height="56" rx="6" fill="#F0FDF4" stroke="#0F172A" stroke-width="1"/>
  <text x="645" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">AI stack advantage</text>
  <text x="645" y="500" text-anchor="middle" font-size="10" fill="#475569">Rich behavioral data fuels</text>
  <text x="645" y="514" text-anchor="middle" font-size="10" fill="#475569">agentic AI personalization</text>

  <!-- Center bridge: reorientation arrow -->
  <path d="M 250,331 Q 400,380 550,331" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="370" text-anchor="middle" font-size="10" fill="#475569">Reorientation: audit your trigger library</text>

  <!-- Gartner note at bottom -->
  <rect x="170" y="535" width="460" height="52" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="400" y="556" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Gartner (Jan 2026): 60% of brands will use agentic AI for 1:1 interactions by 2028</text>
  <text x="400" y="574" text-anchor="middle" font-size="10" fill="#475569">Signal Mode programs have the behavioral data these systems need. Volume Mode programs don't.</text>

  <!-- Footer -->
  <text x="400" y="610" text-anchor="middle" font-size="9" fill="#94A3B8">karansud.com | Sources: Omnisend 2025 eCommerce Report · Gartner Marketing Newsroom 2026</text>
</svg>
