<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="640" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">The AI Paid Ads Input Audit</text>
  <text x="450" y="66" text-anchor="middle" font-size="12" fill="#64748B">Four questions that determine whether your AI bidding works or arbitrages away your gains</text>

  <!-- Divider -->
  <line x1="60" y1="80" x2="840" y2="80" stroke="#E7E5E4" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="60" y="100" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <circle cx="98" cy="134" r="18" fill="#1d4ed8"/>
  <text x="98" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="128" y="128" font-size="13" font-weight="700" fill="#0F172A">Conversion Signal Quality</text>
  <text x="128" y="147" font-size="11" fill="#475569">What event does your AI platform optimize against?</text>
  <rect x="128" y="158" width="140" height="22" rx="4" fill="rgba(220,38,38,0.08)"/>
  <text x="198" y="173" text-anchor="middle" font-size="10" fill="#DC2626" font-weight="600">RISK: Page view or lead</text>
  <rect x="278" y="158" width="140" height="22" rx="4" fill="rgba(29,78,216,0.08)"/>
  <text x="348" y="173" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="600">STRONG: Qualified revenue</text>
  <text x="128" y="200" font-size="10" fill="#94A3B8">AI optimizes toward whatever signal you feed it. Wrong signal = efficient waste.</text>

  <!-- Step 2 -->
  <rect x="460" y="100" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <circle cx="498" cy="134" r="18" fill="#1d4ed8"/>
  <text x="498" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="528" y="128" font-size="13" font-weight="700" fill="#0F172A">First-Party Data Depth</text>
  <text x="528" y="147" font-size="11" fill="#475569">What customer data are you uploading to ad platforms?</text>
  <rect x="528" y="158" width="140" height="22" rx="4" fill="rgba(220,38,38,0.08)"/>
  <text x="598" y="173" text-anchor="middle" font-size="10" fill="#DC2626" font-weight="600">RISK: Email list only</text>
  <rect x="678" y="158" width="140" height="22" rx="4" fill="rgba(29,78,216,0.08)"/>
  <text x="748" y="173" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="600">STRONG: LTV segments</text>
  <text x="528" y="200" font-size="10" fill="#94A3B8">Platforms running the same AI bid identically for identical signals. Your data is the differentiator.</text>

  <!-- Connector arrows down -->
  <line x1="250" y1="210" x2="250" y2="240" stroke="#E7E5E4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="210" x2="650" y2="240" stroke="#E7E5E4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="60" y="250" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <circle cx="98" cy="284" r="18" fill="#1d4ed8"/>
  <text x="98" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="128" y="278" font-size="13" font-weight="700" fill="#0F172A">Audience Exclusion Discipline</text>
  <text x="128" y="297" font-size="11" fill="#475569">Have you told the platform who NOT to reach?</text>
  <rect x="128" y="308" width="140" height="22" rx="4" fill="rgba(220,38,38,0.08)"/>
  <text x="198" y="323" text-anchor="middle" font-size="10" fill="#DC2626" font-weight="600">RISK: No exclusions set</text>
  <rect x="278" y="308" width="140" height="22" rx="4" fill="rgba(29,78,216,0.08)"/>
  <text x="348" y="323" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="600">STRONG: Existing customers out</text>
  <text x="128" y="350" font-size="10" fill="#94A3B8">PMax and Advantage+ chase easy conversions — including your existing customers.</text>

  <!-- Step 4 -->
  <rect x="460" y="250" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <circle cx="498" cy="284" r="18" fill="#1d4ed8"/>
  <text x="498" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
  <text x="528" y="278" font-size="13" font-weight="700" fill="#0F172A">Independent Measurement</text>
  <text x="528" y="297" font-size="11" fill="#475569">Can you verify AI gains outside the platform dashboard?</text>
  <rect x="528" y="308" width="140" height="22" rx="4" fill="rgba(220,38,38,0.08)"/>
  <text x="598" y="323" text-anchor="middle" font-size="10" fill="#DC2626" font-weight="600">RISK: Platform-reported only</text>
  <rect x="678" y="308" width="140" height="22" rx="4" fill="rgba(29,78,216,0.08)"/>
  <text x="748" y="323" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="600">STRONG: Incrementality tests</text>
  <text x="528" y="350" font-size="10" fill="#94A3B8">Gartner: "The more AI influences advertising decisions, the more important independent measurement becomes."</text>

  <!-- Connector down to outcome -->
  <line x1="250" y1="360" x2="250" y2="400" stroke="#E7E5E4" stroke-width="2"/>
  <line x1="650" y1="360" x2="650" y2="400" stroke="#E7E5E4" stroke-width="2"/>
  <line x1="250" y1="400" x2="650" y2="400" stroke="#E7E5E4" stroke-width="2"/>
  <line x1="450" y1="400" x2="450" y2="430" stroke="#E7E5E4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Outcome box -->
  <rect x="200" y="440" width="500" height="90" rx="10" fill="#0F172A"/>
  <text x="450" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Your AI Bidding Outcome</text>
  <text x="450" y="490" text-anchor="middle" font-size="11" fill="#94A3B8">Pass all 4: First-party data moat. AI scales YOUR advantage.</text>
  <text x="450" y="508" text-anchor="middle" font-size="11" fill="#DC2626">Fail 2+: Efficiency gains erased by auction dynamics. You fund the platform, not performance.</text>

  <!-- Footer note -->
  <text x="450" y="560" text-anchor="middle" font-size="10" fill="#94A3B8">By 2028, Gartner forecasts 70% of global ad spend through AI-influenced platforms (Aug 2026).</text>
  <text x="450" y="576" text-anchor="middle" font-size="10" fill="#94A3B8">When every competitor runs the same algorithm, your inputs are your only edge.</text>
  <text x="450" y="610" text-anchor="middle" font-size="9" fill="#CBD5E1">AI Paid Advertising Optimization — karan-sud-portfolio.vercel.app</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E7E5E4"/>
    </marker>
  </defs>
</svg>
