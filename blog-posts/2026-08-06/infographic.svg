<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#FAFAF9;">

  <!-- Background -->
  <rect width="800" height="620" fill="#FAFAF9" rx="12"/>

  <!-- Title block -->
  <rect x="0" y="0" width="800" height="72" fill="#0F172A" rx="12"/>
  <rect x="0" y="56" width="800" height="16" fill="#0F172A"/>
  <text x="400" y="30" text-anchor="middle" fill="#FAFAF9" font-size="17" font-weight="700">The Original Research Content Framework</text>
  <text x="400" y="54" text-anchor="middle" fill="#94A3B8" font-size="11">How to build content AI cannot replicate, based on CMI B2B 2025 benchmarks</text>

  <!-- Step labels -->
  <!-- Step 1: Hypothesis -->
  <rect x="40" y="96" width="220" height="112" fill="#FFFFFF" rx="8" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="40" y="96" width="220" height="6" fill="#DC2626" rx="4"/>
  <text x="52" y="122" fill="#DC2626" font-size="10" font-weight="700">STEP 1</text>
  <text x="52" y="140" fill="#0F172A" font-size="13.5" font-weight="700">Identify the Tension</text>
  <text x="52" y="160" fill="#475569" font-size="10.5" text-decoration="none">Find a question your buyers</text>
  <text x="52" y="175" fill="#475569" font-size="10.5">actively disagree about.</text>
  <text x="52" y="195" fill="#475569" font-size="10.5" font-style="italic">"What do we believe that</text>
  <text x="52" y="207" fill="#475569" font-size="10.5" font-style="italic"> our market gets wrong?"</text>

  <!-- Arrow 1 -->
  <line x1="260" y1="152" x2="295" y2="152" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Methodology -->
  <rect x="295" y="96" width="220" height="112" fill="#FFFFFF" rx="8" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="295" y="96" width="220" height="6" fill="#475569" rx="4"/>
  <text x="307" y="122" fill="#475569" font-size="10" font-weight="700">STEP 2</text>
  <text x="307" y="140" fill="#0F172A" font-size="13.5" font-weight="700">Design the Sample</text>
  <text x="307" y="160" fill="#475569" font-size="10.5">300 qualified buyers beats</text>
  <text x="307" y="175" fill="#475569" font-size="10.5">1,000 unfiltered sign-ups.</text>
  <text x="307" y="195" fill="#475569" font-size="10.5">Document your methodology.</text>
  <text x="307" y="210" fill="#475569" font-size="10.5">Defensibility = citation value.</text>

  <!-- Arrow 2 -->
  <line x1="515" y1="152" x2="550" y2="152" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Data Collection -->
  <rect x="550" y="96" width="210" height="112" fill="#FFFFFF" rx="8" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="550" y="96" width="210" height="6" fill="#475569" rx="4"/>
  <text x="562" y="122" fill="#475569" font-size="10" font-weight="700">STEP 3</text>
  <text x="562" y="140" fill="#0F172A" font-size="13.5" font-weight="700">Collect the Data</text>
  <text x="562" y="160" fill="#475569" font-size="10.5">Survey, interview, or pull</text>
  <text x="562" y="175" fill="#475569" font-size="10.5">anonymized product data.</text>
  <text x="562" y="195" fill="#475569" font-size="10.5">Partner research reduces cost.</text>
  <text x="562" y="210" fill="#475569" font-size="10.5">Advisory boards accelerate it.</text>

  <!-- Divider row separator -->
  <line x1="40" y1="235" x2="760" y2="235" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Down arrows connecting to row 2 -->
  <line x1="150" y1="215" x2="150" y2="252" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="215" x2="400" y2="252" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="655" y1="215" x2="655" y2="252" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Find the counter-intuitive -->
  <rect x="40" y="255" width="220" height="112" fill="#FFFFFF" rx="8" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="40" y="255" width="220" height="6" fill="#475569" rx="4"/>
  <text x="52" y="281" fill="#475569" font-size="10" font-weight="700">STEP 4</text>
  <text x="52" y="299" fill="#0F172A" font-size="13.5" font-weight="700">Find the Surprise</text>
  <text x="52" y="319" fill="#475569" font-size="10.5">One counter-intuitive finding</text>
  <text x="52" y="334" fill="#475569" font-size="10.5">makes the research repeatable.</text>
  <text x="52" y="354" fill="#DC2626" font-size="10.5" font-weight="600">If it confirms what everyone</text>
  <text x="52" y="366" fill="#DC2626" font-size="10.5" font-weight="600">believed, you made content.</text>

  <!-- Arrow between step 4 and 5 -->
  <line x1="260" y1="311" x2="295" y2="311" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Distribute -->
  <rect x="295" y="255" width="220" height="112" fill="#FFFFFF" rx="8" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="295" y="255" width="220" height="6" fill="#475569" rx="4"/>
  <text x="307" y="281" fill="#475569" font-size="10" font-weight="700">STEP 5</text>
  <text x="307" y="299" fill="#0F172A" font-size="13.5" font-weight="700">Distribute for Citation</text>
  <text x="307" y="319" fill="#475569" font-size="10.5">Target trade publications,</text>
  <text x="307" y="334" fill="#475569" font-size="10.5">newsletters, and analysts.</text>
  <text x="307" y="354" fill="#475569" font-size="10.5">Citations in AI training data</text>
  <text x="307" y="369" fill="#475569" font-size="10.5">compound over time.</text>

  <!-- Arrow between step 5 and 6 -->
  <line x1="515" y1="311" x2="550" y2="311" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Scale with AI -->
  <rect x="550" y="255" width="210" height="112" fill="#FFFFFF" rx="8" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="550" y="255" width="210" height="6" fill="#0F172A" rx="4"/>
  <text x="562" y="281" fill="#0F172A" font-size="10" font-weight="700">STEP 6</text>
  <text x="562" y="299" fill="#0F172A" font-size="13.5" font-weight="700">Scale with AI</text>
  <text x="562" y="319" fill="#475569" font-size="10.5">Use AI to repurpose findings</text>
  <text x="562" y="334" fill="#475569" font-size="10.5">into posts, threads, emails.</text>
  <text x="562" y="354" fill="#DC2626" font-size="10.5" font-weight="600">AI as distribution, not source.</text>
  <text x="562" y="369" fill="#475569" font-size="10.5">Your data stays unreplicable.</text>

  <!-- Outcome bar -->
  <rect x="40" y="395" width="720" height="78" fill="#0F172A" rx="8"/>
  <text x="400" y="422" text-anchor="middle" fill="#FAFAF9" font-size="13" font-weight="700">The Outcome: 64% Higher Conversion Rates</text>
  <text x="400" y="443" text-anchor="middle" fill="#94A3B8" font-size="10.5">Marketers publishing original proprietary research vs. generic content</text>
  <text x="400" y="460" text-anchor="middle" fill="#94A3B8" font-size="10">(Source: Content Marketing Institute B2B Benchmarks 2025, n=1,015)</text>

  <!-- Three differentiation pillars -->
  <rect x="40" y="490" width="222" height="100" fill="#FFFFFF" rx="8" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="151" y="516" text-anchor="middle" fill="#DC2626" font-size="20" font-weight="700">01</text>
  <text x="151" y="536" text-anchor="middle" fill="#0F172A" font-size="11.5" font-weight="700">Only You Have This Data</text>
  <text x="151" y="553" text-anchor="middle" fill="#475569" font-size="10">No AI can reproduce your</text>
  <text x="151" y="568" text-anchor="middle" fill="#475569" font-size="10">proprietary methodology</text>
  <text x="151" y="583" text-anchor="middle" fill="#475569" font-size="10">or your respondent pool.</text>

  <rect x="289" y="490" width="222" height="100" fill="#FFFFFF" rx="8" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="400" y="516" text-anchor="middle" fill="#DC2626" font-size="20" font-weight="700">02</text>
  <text x="400" y="536" text-anchor="middle" fill="#0F172A" font-size="11.5" font-weight="700">AI Search Cites Primary Sources</text>
  <text x="400" y="553" text-anchor="middle" fill="#475569" font-size="10">LLMs favor research cited</text>
  <text x="400" y="568" text-anchor="middle" fill="#475569" font-size="10">in authoritative outlets.</text>
  <text x="400" y="583" text-anchor="middle" fill="#475569" font-size="10">Original data earns that.</text>

  <rect x="538" y="490" width="222" height="100" fill="#FFFFFF" rx="8" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="649" y="516" text-anchor="middle" fill="#DC2626" font-size="20" font-weight="700">03</text>
  <text x="649" y="536" text-anchor="middle" fill="#0F172A" font-size="11.5" font-weight="700">Compounds Over Time</text>
  <text x="649" y="553" text-anchor="middle" fill="#475569" font-size="10">Research cited today appears</text>
  <text x="649" y="568" text-anchor="middle" fill="#475569" font-size="10">in model training data</text>
  <text x="649" y="583" text-anchor="middle" fill="#475569" font-size="10">for years afterward.</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748B"/>
    </marker>
  </defs>

</svg>
