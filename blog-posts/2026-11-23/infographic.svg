<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica Neue, Arial, sans-serif">
  <rect width="720" height="520" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">The B2B Buyer Journey Attribution Gap</text>
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#64748B">Where buying decisions form vs. what attribution tracks</text>

  <!-- Journey timeline arrow -->
  <line x1="60" y1="150" x2="660" y2="150" stroke="#E2E8F0" stroke-width="2"/>
  <polygon points="660,145 670,150 660,155" fill="#E2E8F0"/>
  <text x="60" y="170" font-size="10" fill="#94A3B8">START OF JOURNEY</text>
  <text x="560" y="170" font-size="10" fill="#94A3B8">CLOSE WON</text>

  <!-- 61% marker -->
  <line x1="427" y1="100" x2="427" y2="200" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="427" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">61% MARK</text>
  <text x="427" y="210" text-anchor="middle" font-size="10" fill="#DC2626">First vendor contact</text>

  <!-- DARK ZONE (0-61%) -->
  <rect x="60" y="120" width="367" height="60" rx="4" fill="#0F172A" opacity="0.06"/>
  <rect x="60" y="120" width="367" height="60" rx="4" fill="none" stroke="#0F172A" stroke-width="1" opacity="0.15"/>
  <text x="243" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">INVISIBLE TO ATTRIBUTION</text>
  <text x="243" y="162" text-anchor="middle" font-size="11" fill="#475569">61% of journey — before first contact</text>

  <!-- VISIBLE ZONE (61-100%) -->
  <rect x="427" y="120" width="233" height="60" rx="4" fill="#DC2626" opacity="0.08"/>
  <rect x="427" y="120" width="233" height="60" rx="4" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <text x="543" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">VISIBLE TO ATTRIBUTION</text>
  <text x="543" y="162" text-anchor="middle" font-size="11" fill="#DC2626">39% of journey — post-contact</text>

  <!-- Activity nodes in dark zone -->
  <!-- Node 1 -->
  <circle cx="110" cy="250" r="30" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="110" y="246" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">PEER</text>
  <text x="110" y="258" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">REVIEWS</text>
  <line x1="110" y1="180" x2="110" y2="220" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Node 2 -->
  <circle cx="200" cy="250" r="30" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="200" y="246" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">DARK</text>
  <text x="200" y="258" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">SOCIAL</text>
  <line x1="200" y1="180" x2="200" y2="220" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Node 3 -->
  <circle cx="290" cy="250" r="30" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="290" y="246" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">AI</text>
  <text x="290" y="258" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">SEARCH</text>
  <line x1="290" y1="180" x2="290" y2="220" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Node 4 -->
  <circle cx="380" cy="250" r="30" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="380" y="246" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">PODCAST</text>
  <text x="380" y="258" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">MENTIONS</text>
  <line x1="380" y1="180" x2="380" y2="220" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Activity nodes in visible zone -->
  <!-- Node 5 -->
  <circle cx="480" cy="250" r="30" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="480" y="246" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">DEMO</text>
  <text x="480" y="258" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">REQUEST</text>
  <line x1="480" y1="180" x2="480" y2="220" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Node 6 -->
  <circle cx="570" cy="250" r="30" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="570" y="246" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">AD</text>
  <text x="570" y="258" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">CLICK</text>
  <line x1="570" y1="180" x2="570" y2="220" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Node 7 -->
  <circle cx="650" cy="250" r="30" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="650" y="246" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">FORM</text>
  <text x="650" y="258" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">SUBMIT</text>
  <line x1="650" y1="180" x2="650" y2="220" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Attribution model label -->
  <rect x="427" y="295" width="233" height="22" rx="3" fill="#DC2626" opacity="0.12"/>
  <text x="543" y="310" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="600">↑ Attribution model only sees this ↑</text>

  <!-- Three signals box -->
  <rect x="60" y="310" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="230" y="333" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Proxy signals for the invisible 61%</text>
  <circle cx="90" cy="354" r="5" fill="#0F172A"/>
  <text x="104" y="358" font-size="11" fill="#475569">Branded search volume lift</text>
  <circle cx="90" cy="373" r="5" fill="#0F172A"/>
  <text x="104" y="377" font-size="11" fill="#475569">Self-reported "how did you hear about us?"</text>
  <circle cx="90" cy="392" r="5" fill="#0F172A"/>
  <text x="104" y="396" font-size="11" fill="#475569">Time-based brand lift via geo holdouts</text>

  <!-- Stats strip -->
  <rect x="60" y="420" width="600" height="68" rx="6" fill="#0F172A"/>

  <text x="160" y="445" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">85%</text>
  <text x="160" y="462" text-anchor="middle" font-size="10" fill="#94A3B8">feel confident</text>
  <text x="160" y="474" text-anchor="middle" font-size="10" fill="#94A3B8">measuring ROI</text>

  <line x1="253" y1="430" x2="253" y2="478" stroke="#1E293B" stroke-width="1"/>

  <text x="360" y="445" text-anchor="middle" font-size="20" font-weight="800" fill="#DC2626">32%</text>
  <text x="360" y="462" text-anchor="middle" font-size="10" fill="#94A3B8">actually measure</text>
  <text x="360" y="474" text-anchor="middle" font-size="10" fill="#94A3B8">holistically</text>

  <line x1="467" y1="430" x2="467" y2="478" stroke="#1E293B" stroke-width="1"/>

  <text x="563" y="445" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">61%</text>
  <text x="563" y="462" text-anchor="middle" font-size="10" fill="#94A3B8">of journey complete</text>
  <text x="563" y="474" text-anchor="middle" font-size="10" fill="#94A3B8">before first contact</text>

  <!-- Footer -->
  <text x="360" y="510" text-anchor="middle" font-size="10" fill="#94A3B8">Sources: Nielsen 2025 Global Annual Marketing Survey · 6sense 2025 B2B Buyer Experience Report · IAB State of Data 2026</text>
</svg>
