<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#FAFAF9;">

  <!-- Background -->
  <rect width="800" height="620" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#DC2626" text-transform="uppercase">FRAMEWORK</text>
  <text x="400" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">The activation audit: finding your real conversion lever</text>

  <!-- Step 1 -->
  <rect x="60" y="104" width="680" height="72" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <circle cx="96" cy="140" r="18" fill="#0F172A"/>
  <text x="96" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="128" y="133" font-size="13" font-weight="700" fill="#0F172A">Define your core value promise</text>
  <text x="128" y="154" font-size="12" fill="#475569">What outcome does your product actually deliver? Not the feature list — the before/after for the user.</text>

  <!-- Arrow 1→2 -->
  <line x1="400" y1="176" x2="400" y2="196" stroke="#E7E5E4" stroke-width="2"/>
  <polygon points="394,192 406,192 400,202" fill="#E7E5E4"/>

  <!-- Step 2 -->
  <rect x="60" y="200" width="680" height="72" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <circle cx="96" cy="236" r="18" fill="#0F172A"/>
  <text x="96" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="128" y="229" font-size="13" font-weight="700" fill="#0F172A">Identify the activation event</text>
  <text x="128" y="250" font-size="12" fill="#475569">Which single in-product action proves the user has experienced that value? (Not login. Not onboarding complete.)</text>

  <!-- Arrow 2→3 -->
  <line x1="400" y1="272" x2="400" y2="292" stroke="#E7E5E4" stroke-width="2"/>
  <polygon points="394,288 406,288 400,298" fill="#E7E5E4"/>

  <!-- Step 3 -->
  <rect x="60" y="296" width="680" height="72" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <circle cx="96" cy="332" r="18" fill="#0F172A"/>
  <text x="96" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="128" y="325" font-size="13" font-weight="700" fill="#0F172A">Measure time to activation</text>
  <text x="128" y="346" font-size="12" fill="#475569">How long does it take your best-converting cohort to reach that event? Set that as your benchmark time to value.</text>

  <!-- Arrow 3→decision -->
  <line x1="400" y1="368" x2="400" y2="392" stroke="#E7E5E4" stroke-width="2"/>
  <polygon points="394,388 406,388 400,398" fill="#E7E5E4"/>

  <!-- Decision diamond -->
  <polygon points="400,400 480,440 400,480 320,440" fill="#0F172A" stroke="#0F172A"/>
  <text x="400" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">What % of signups</text>
  <text x="400" y="451" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">activate within 14 days?</text>

  <!-- Branch lines from diamond -->
  <!-- Left branch: <30% -->
  <line x1="320" y1="440" x2="140" y2="440" stroke="#E7E5E4" stroke-width="1.5"/>
  <line x1="140" y1="440" x2="140" y2="492" stroke="#E7E5E4" stroke-width="1.5"/>
  <polygon points="134,488 146,488 140,498" fill="#E7E5E4"/>

  <!-- Middle branch: 30–60% -->
  <line x1="400" y1="480" x2="400" y2="492" stroke="#E7E5E4" stroke-width="1.5"/>
  <polygon points="394,488 406,488 400,498" fill="#E7E5E4"/>

  <!-- Right branch: >60% -->
  <line x1="480" y1="440" x2="660" y2="440" stroke="#E7E5E4" stroke-width="1.5"/>
  <line x1="660" y1="440" x2="660" y2="492" stroke="#E7E5E4" stroke-width="1.5"/>
  <polygon points="654,488 666,488 660,498" fill="#E7E5E4"/>

  <!-- Branch labels above boxes -->
  <text x="140" y="430" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">&lt; 30%</text>
  <text x="400" y="492" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">30–60%</text>
  <text x="660" y="430" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">&gt; 60%</text>

  <!-- Left outcome box -->
  <rect x="60" y="498" width="160" height="82" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="140" y="522" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Fix the path</text>
  <text x="140" y="539" text-anchor="middle" font-size="10" fill="#0F172A">Remove friction before</text>
  <text x="140" y="554" text-anchor="middle" font-size="10" fill="#0F172A">the activation event.</text>
  <text x="140" y="569" text-anchor="middle" font-size="10" fill="#0F172A">Shorten time to value.</text>

  <!-- Middle outcome box -->
  <rect x="320" y="498" width="160" height="82" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="400" y="522" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Optimize the moment</text>
  <text x="400" y="539" text-anchor="middle" font-size="10" fill="#475569">Test the activation event</text>
  <text x="400" y="554" text-anchor="middle" font-size="10" fill="#475569">trigger. Add contextual</text>
  <text x="400" y="569" text-anchor="middle" font-size="10" fill="#475569">nudges at drop-off points.</text>

  <!-- Right outcome box -->
  <rect x="540" y="498" width="160" height="82" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="620" y="522" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Activate → convert</text>
  <text x="620" y="539" text-anchor="middle" font-size="10" fill="#475569">Use product signals to</text>
  <text x="620" y="554" text-anchor="middle" font-size="10" fill="#475569">trigger sales outreach</text>
  <text x="620" y="569" text-anchor="middle" font-size="10" fill="#475569">at the right moment.</text>

  <!-- Source line -->
  <text x="400" y="610" text-anchor="middle" font-size="10" fill="#94A3B8">Framework based on ProductLed Benchmarks 2025 and OpenView Partners activation research</text>
</svg>
