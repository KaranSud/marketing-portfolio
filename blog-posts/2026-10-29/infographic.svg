  <rect x="350" y="100" width="200" height="46" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="450" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">SHARED FOUNDATIONS</text>
  <text x="450" y="136" text-anchor="middle" font-size="10" fill="#166534">Both systems reward these</text>

  <rect x="350" y="162" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="450" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">Content quality</text>
  <text x="450" y="199" text-anchor="middle" font-size="11" fill="#64748B">E-E-A-T signals</text>

  <rect x="350" y="218" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="450" y="239" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">Structured markup</text>
  <text x="450" y="255" text-anchor="middle" font-size="11" fill="#64748B">Schema, entities</text>

  <rect x="350" y="274" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="450" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">Technical accessibility</text>
  <text x="450" y="311" text-anchor="middle" font-size="11" fill="#64748B">Crawlable, fast, clean</text>

  <!-- The GAP box -->
  <rect x="350" y="340" width="200" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="450" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">THE GAP</text>
  <line x1="370" y1="370" x2="530" y2="370" stroke="#FCA5A5" stroke-width="1"/>
  <text x="450" y="387" text-anchor="middle" font-size="11" fill="#7F1D1D">62–83% of AI citations</text>
  <text x="450" y="403" text-anchor="middle" font-size="11" fill="#7F1D1D">go to pages NOT</text>
  <text x="450" y="419" text-anchor="middle" font-size="11" font-weight="600" fill="#DC2626">ranking in the top 10</text>

  <!-- New metric box -->
  <rect x="350" y="454" width="200" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="450" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">NEW METRIC NEEDED</text>
  <line x1="370" y1="483" x2="530" y2="483" stroke="#BFDBFE" stroke-width="1"/>
  <text x="450" y="499" text-anchor="middle" font-size="11" fill="#1E40AF">Track citation rate</text>
  <text x="450" y="515" text-anchor="middle" font-size="11" fill="#1E40AF">not just rankings</text>
  <text x="450" y="531" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">across 8+ AI engines</text>

  <!-- Footer note -->
  <line x1="60" y1="580" x2="840" y2="580" stroke="#E2E8F0" stroke-width="1"/>
  <text x="60" y="598" font-size="10" fill="#94A3B8">Sources: Conductor, Ahrefs, Pew Research Center, Bain &amp; Company. "S" denotes signals shared by both systems.</text>
  <text x="60" y="614" font-size="10" fill="#94A3B8">Infographic: karansud98@gmail.com / karan-sud-portfolio.vercel.app</text>

