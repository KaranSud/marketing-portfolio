  <circle cx="74" cy="522" r="10" fill="#16A34A"/>
  <text x="74" y="526" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">S</text>
  <text x="96" y="518" font-size="12" font-weight="600" fill="#15803D">Structured data markup</text>
  <text x="96" y="534" font-size="11" fill="#166534">Schema, entity clarity</text>

