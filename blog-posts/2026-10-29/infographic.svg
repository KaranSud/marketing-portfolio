  <circle cx="74" cy="466" r="10" fill="#16A34A"/>
  <text x="74" y="470" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">S</text>
  <text x="96" y="462" font-size="12" font-weight="600" fill="#15803D">Content quality + E-E-A-T</text>
  <text x="96" y="478" font-size="11" fill="#166534">Expertise, experience, authority</text>

