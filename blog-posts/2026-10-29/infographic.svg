  <rect x="606" y="162" width="246" height="48" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="632" cy="186" r="10" fill="#FEE2E2"/>
  <text x="632" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">1</text>
  <text x="654" y="182" font-size="12" font-weight="600" fill="#0F172A">Answer-first structure</text>
  <text x="654" y="198" font-size="11" fill="#64748B">Conclusion in first paragraph</text>

  <rect x="606" y="218" width="246" height="48" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="632" cy="242" r="10" fill="#FEE2E2"/>
  <text x="632" y="246" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">2</text>
  <text x="654" y="238" font-size="12" font-weight="600" fill="#0F172A">Original, verifiable data</text>
  <text x="654" y="254" font-size="11" fill="#64748B">Unique facts, named sources</text>

  <rect x="606" y="274" width="246" height="48" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="632" cy="298" r="10" fill="#FEE2E2"/>
  <text x="632" y="302" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">3</text>
  <text x="654" y="294" font-size="12" font-weight="600" fill="#0F172A">Factual density</text>
  <text x="654" y="310" font-size="11" fill="#64748B">Specific numbers, dates, orgs</text>

