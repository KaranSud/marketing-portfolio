  <circle cx="632" cy="354" r="10" fill="#FEE2E2"/>
  <text x="632" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">4</text>
  <text x="654" y="350" font-size="12" font-weight="600" fill="#0F172A">Third-party mentions</text>
  <text x="654" y="366" font-size="11" fill="#64748B">Reddit, YouTube, Forbes citations</text>

  <rect x="606" y="386" width="246" height="48" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="632" cy="410" r="10" fill="#FEE2E2"/>
  <text x="632" y="414" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">5</text>
  <text x="654" y="406" font-size="12" font-weight="600" fill="#0F172A">Entity disambiguation</text>
  <text x="654" y="422" font-size="11" fill="#64748B">Unambiguous brand, product IDs</text>

  <!-- Shared signals (right side) -->
  <rect x="606" y="442" width="246" height="48" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <circle cx="632" cy="466" r="10" fill="#16A34A"/>
  <text x="632" y="470" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">S</text>
  <text x="654" y="462" font-size="12" font-weight="600" fill="#15803D">Content quality + E-E-A-T</text>
  <text x="654" y="478" font-size="11" fill="#166534">Shared with Google ranking</text>

  <rect x="606" y="498" width="246" height="48" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <circle cx="632" cy="522" r="10" fill="#16A34A"/>
  <text x="632" y="526" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">S</text>
  <text x="654" y="518" font-size="12" font-weight="600" fill="#15803D">Structured data markup</text>
  <text x="654" y="534" font-size="11" fill="#166534">Shared with Google ranking</text>

  <!-- CENTER BRIDGE -->
  <!-- Arrows and overlap label -->
  <line x1="294" y1="462" x2="350" y2="462" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="462" x2="606" y2="462" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="294" y1="518" x2="350" y2="518" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="518" x2="606" y2="518" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4,3"/>

