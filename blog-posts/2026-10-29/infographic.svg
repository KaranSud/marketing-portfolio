<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" style="background:#FAFAF9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;">

  <!-- Background -->
  <rect width="900" height="640" fill="#FAFAF9"/>

  <!-- Title block -->
  <text x="450" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Why Your Rankings and Your AI Citations Are Two Different Lists</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#475569">What each system weighs when deciding what to show buyers</text>

  <!-- Divider under title -->
  <line x1="60" y1="82" x2="840" y2="82" stroke="#E2E8F0" stroke-width="1"/>

  <!-- LEFT COLUMN: Google Ranking Signals -->
  <!-- Header box -->
  <rect x="48" y="100" width="246" height="46" rx="8" fill="#1E293B"/>
  <text x="171" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#F8FAFC">GOOGLE RANKING</text>
  <text x="171" y="137" text-anchor="middle" font-size="11" fill="#94A3B8">Signals that move your position</text>

  <!-- Google signal cards -->
  <rect x="48" y="162" width="246" height="48" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="74" cy="186" r="10" fill="#E2E8F0"/>
  <text x="74" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">1</text>
  <text x="96" y="182" font-size="12" font-weight="600" fill="#0F172A">Domain authority</text>
  <text x="96" y="198" font-size="11" fill="#64748B">Backlinks, domain age, trust</text>

  <rect x="48" y="218" width="246" height="48" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="74" cy="242" r="10" fill="#E2E8F0"/>
  <text x="74" y="246" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">2</text>
  <text x="96" y="238" font-size="12" font-weight="600" fill="#0F172A">Keyword relevance</text>
  <text x="96" y="254" font-size="11" fill="#64748B">Semantic match, density, intent</text>

  <rect x="48" y="274" width="246" height="48" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="74" cy="298" r="10" fill="#E2E8F0"/>
  <text x="74" y="302" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">3</text>
  <text x="96" y="294" font-size="12" font-weight="600" fill="#0F172A">User engagement signals</text>
  <text x="96" y="310" font-size="11" fill="#64748B">CTR, dwell time, bounce rate</text>

  <rect x="48" y="330" width="246" height="48" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="74" cy="354" r="10" fill="#E2E8F0"/>
  <text x="74" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">4</text>
  <text x="96" y="350" font-size="12" font-weight="600" fill="#0F172A">Page experience</text>
  <text x="96" y="366" font-size="11" fill="#64748B">Core Web Vitals, mobile, speed</text>

  <rect x="48" y="386" width="246" height="48" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="74" cy="410" r="10" fill="#E2E8F0"/>
  <text x="74" y="414" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">5</text>
