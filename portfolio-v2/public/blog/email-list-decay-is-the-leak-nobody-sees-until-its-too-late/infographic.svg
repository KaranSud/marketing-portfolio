<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="640" height="400" fill="#FAFAF9" rx="12"/>

  <!-- Header -->
  <text x="32" y="40" fill="#0F172A" font-size="15" font-weight="700">The Email List Quality Audit: Four Ongoing Operations</text>
  <text x="32" y="58" fill="#475569" font-size="12">What separates programs with stable inbox placement from those that spiral</text>

  <!-- Connector line -->
  <line x1="68" y1="160" x2="572" y2="160" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- STEP 1 -->
  <rect x="32" y="80" width="132" height="172" rx="6" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="66" cy="106" r="13" fill="#DC2626"/>
  <text x="66" y="111" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">1</text>
  <text x="86" y="104" fill="#0F172A" font-size="10" font-weight="700" letter-spacing="0.07em">CAPTURE</text>
  <text x="86" y="117" fill="#0F172A" font-size="10" font-weight="700" letter-spacing="0.07em">GATE</text>
  <text x="44" y="142" fill="#0F172A" font-size="12" font-weight="600">Verify at</text>
  <text x="44" y="157" fill="#0F172A" font-size="12" font-weight="600">entry</text>
  <text x="44" y="178" fill="#475569" font-size="11">API check on</text>
  <text x="44" y="192" fill="#475569" font-size="11">every signup.</text>
  <text x="44" y="206" fill="#475569" font-size="11">Filters typos,</text>
  <text x="44" y="220" fill="#475569" font-size="11">role addresses,</text>
  <text x="44" y="234" fill="#475569" font-size="11">fakes.</text>

  <!-- Arrow 1→2 -->
  <polygon points="174,157 186,160 174,163" fill="#94A3B8"/>

  <!-- STEP 2 -->
  <rect x="192" y="80" width="132" height="172" rx="6" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="226" cy="106" r="13" fill="#DC2626"/>
  <text x="226" y="111" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">2</text>
  <text x="246" y="104" fill="#0F172A" font-size="10" font-weight="700" letter-spacing="0.07em">SUNSET</text>
  <text x="246" y="117" fill="#0F172A" font-size="10" font-weight="700" letter-spacing="0.07em">POLICY</text>
  <text x="204" y="142" fill="#0F172A" font-size="12" font-weight="600">Suppress the</text>
  <text x="204" y="157" fill="#0F172A" font-size="12" font-weight="600">unengaged</text>
  <text x="204" y="178" fill="#475569" font-size="11">90 days silent</text>
  <text x="204" y="192" fill="#475569" font-size="11">→ re-engage</text>
  <text x="204" y="206" fill="#475569" font-size="11">flow. No</text>
  <text x="204" y="220" fill="#475569" font-size="11">response in</text>
  <text x="204" y="234" fill="#475569" font-size="11">30 days → off.</text>

  <!-- Arrow 2→3 -->
  <polygon points="334,157 346,160 334,163" fill="#94A3B8"/>

  <!-- STEP 3 -->
  <rect x="352" y="80" width="132" height="172" rx="6" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="386" cy="106" r="13" fill="#DC2626"/>
  <text x="386" y="111" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">3</text>
  <text x="406" y="104" fill="#0F172A" font-size="10" font-weight="700" letter-spacing="0.07em">REPUTATION</text>
  <text x="406" y="117" fill="#0F172A" font-size="10" font-weight="700" letter-spacing="0.07em">MONITOR</text>
  <text x="364" y="142" fill="#0F172A" font-size="12" font-weight="600">Watch your</text>
  <text x="364" y="157" fill="#0F172A" font-size="12" font-weight="600">domain score</text>
  <text x="364" y="178" fill="#475569" font-size="11">Postmaster</text>
  <text x="364" y="192" fill="#475569" font-size="11">Tools + MS</text>
  <text x="364" y="206" fill="#475569" font-size="11">JMRP. Spam</text>
  <text x="364" y="220" fill="#475569" font-size="11">rate &gt;0.1%:</text>
  <text x="364" y="234" fill="#475569" font-size="11">act now.</text>

  <!-- Arrow 3→4 -->
  <polygon points="494,157 506,160 494,163" fill="#94A3B8"/>

  <!-- STEP 4 -->
  <rect x="512" y="80" width="96" height="172" rx="6" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="538" cy="106" r="13" fill="#DC2626"/>
  <text x="538" y="111" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">4</text>
  <text x="557" y="111" fill="#0F172A" font-size="10" font-weight="700" letter-spacing="0.07em">AUDIT</text>
  <text x="520" y="142" fill="#0F172A" font-size="12" font-weight="600">Quarterly</text>
  <text x="520" y="157" fill="#0F172A" font-size="12" font-weight="600">review</text>
  <text x="520" y="178" fill="#475569" font-size="11">Hard bounce</text>
  <text x="520" y="192" fill="#475569" font-size="11">rate, complaint</text>
  <text x="520" y="206" fill="#475569" font-size="11">rate, and</text>
  <text x="520" y="220" fill="#475569" font-size="11">engagement</text>
  <text x="520" y="234" fill="#475569" font-size="11">distribution.</text>

  <!-- Stat callout -->
  <rect x="32" y="272" width="576" height="52" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="52" y="300" fill="#DC2626" font-size="22" font-weight="700">Only 24%</text>
  <text x="174" y="300" fill="#475569" font-size="13"> of email programs use a sunset policy. 39% never clean their lists.</text>
  <text x="52" y="316" fill="#94A3B8" font-size="11">Source: Sinch Mailgun State of Email Deliverability 2025</text>

  <!-- Footer note -->
  <text x="32" y="354" fill="#475569" font-size="12">These four operations eliminate both hard decay (invalid addresses) and soft decay (silent</text>
  <text x="32" y="370" fill="#475569" font-size="12">inboxes). The tools are free. The only gap is building them into the workflow.</text>

  <text x="32" y="392" fill="#94A3B8" font-size="10">karansud.com · Email marketing and automation</text>
</svg>
