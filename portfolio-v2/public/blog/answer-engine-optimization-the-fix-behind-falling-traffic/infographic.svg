<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#FAFAF9;">

  <!-- Background -->
  <rect width="760" height="620" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">The Dual-Stack Optimization Framework</text>
  <text x="380" y="66" text-anchor="middle" font-size="13" fill="#475569">SEO drives impressions. AEO drives citations. Together they drive pipeline.</text>

  <!-- Divider -->
  <line x1="60" y1="82" x2="700" y2="82" stroke="#E7E5E4" stroke-width="1"/>

  <!-- ===== LEFT STACK: SEO ===== -->
  <rect x="48" y="100" width="290" height="420" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="48" y="100" width="290" height="48" rx="12" fill="#0F172A"/>
  <rect x="48" y="136" width="290" height="12" fill="#0F172A"/>
  <text x="193" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Traditional SEO</text>
  <text x="193" y="148" text-anchor="middle" font-size="11" fill="#94A3B8">Drives impressions and brand discovery</text>

  <!-- SEO items -->
  <g transform="translate(72, 172)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="242" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="27" r="8" fill="#E2E8F0"/>
    <text x="20" y="31" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">1</text>
    <text x="38" y="20" font-size="12" font-weight="600" fill="#0F172A">Keyword targeting</text>
    <text x="38" y="36" font-size="11" fill="#64748B">Rank for terms buyers use</text>
    <text x="38" y="50" font-size="10" fill="#94A3B8">Still required for AIO sourcing</text>

    <!-- Item 2 -->
    <rect x="0" y="64" width="242" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="91" r="8" fill="#E2E8F0"/>
    <text x="20" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">2</text>
    <text x="38" y="84" font-size="12" font-weight="600" fill="#0F172A">Technical health</text>
    <text x="38" y="100" font-size="11" fill="#64748B">Core Web Vitals, crawlability</text>
    <text x="38" y="114" font-size="10" fill="#94A3B8">Fast pages = AIO crawl priority</text>

    <!-- Item 3 -->
    <rect x="0" y="128" width="242" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="155" r="8" fill="#E2E8F0"/>
    <text x="20" y="159" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">3</text>
    <text x="38" y="148" font-size="12" font-weight="600" fill="#0F172A">Backlink authority</text>
    <text x="38" y="164" font-size="11" fill="#64748B">Domain credibility signals</text>
    <text x="38" y="178" font-size="10" fill="#94A3B8">Third-party trust = citation signal</text>

    <!-- Item 4 -->
    <rect x="0" y="192" width="242" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="219" r="8" fill="#E2E8F0"/>
    <text x="20" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">4</text>
    <text x="38" y="212" font-size="12" font-weight="600" fill="#0F172A">Content depth</text>
    <text x="38" y="228" font-size="11" fill="#64748B">Long-form, topical coverage</text>
    <text x="38" y="242" font-size="10" fill="#94A3B8">AI sources the most complete answers</text>
  </g>

  <!-- SEO output label -->
  <rect x="80" y="496" width="226" height="28" rx="6" fill="#E2E8F0"/>
  <text x="193" y="515" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">Output: Impressions + ranking signals</text>

  <!-- ===== RIGHT STACK: AEO ===== -->
  <rect x="422" y="100" width="290" height="420" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="422" y="100" width="290" height="48" rx="12" fill="#DC2626"/>
  <rect x="422" y="136" width="290" height="12" fill="#DC2626"/>
  <text x="567" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Answer Engine Optimization</text>
  <text x="567" y="148" text-anchor="middle" font-size="11" fill="#FCA5A5">Drives citations and AI-referred clicks</text>

  <!-- AEO items -->
  <g transform="translate(446, 172)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="242" height="54" rx="8" fill="#FFF5F5" stroke="#FECACA" stroke-width="1"/>
    <circle cx="20" cy="27" r="8" fill="#FEE2E2"/>
    <text x="20" y="31" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">1</text>
    <text x="38" y="20" font-size="12" font-weight="600" fill="#0F172A">Entity clarity</text>
    <text x="38" y="36" font-size="11" fill="#64748B">Clear brand, product, category signals</text>
    <text x="38" y="50" font-size="10" fill="#94A3B8">AI must know what your brand does</text>

    <!-- Item 2 -->
    <rect x="0" y="64" width="242" height="54" rx="8" fill="#FFF5F5" stroke="#FECACA" stroke-width="1"/>
    <circle cx="20" cy="91" r="8" fill="#FEE2E2"/>
    <text x="20" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">2</text>
    <text x="38" y="84" font-size="12" font-weight="600" fill="#0F172A">Structured content</text>
    <text x="38" y="100" font-size="11" fill="#64748B">FAQ schema, How-to, Q&amp;A format</text>
    <text x="38" y="114" font-size="10" fill="#94A3B8">Direct answers beat paragraphs</text>

    <!-- Item 3 -->
    <rect x="0" y="128" width="242" height="54" rx="8" fill="#FFF5F5" stroke="#FECACA" stroke-width="1"/>
    <circle cx="20" cy="155" r="8" fill="#FEE2E2"/>
    <text x="20" y="159" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">3</text>
    <text x="38" y="148" font-size="12" font-weight="600" fill="#0F172A">Third-party brand mentions</text>
    <text x="38" y="164" font-size="11" fill="#64748B">Reddit, LinkedIn, G2, industry press</text>
    <text x="38" y="178" font-size="10" fill="#94A3B8">AI cites what the web talks about</text>

    <!-- Item 4 -->
    <rect x="0" y="192" width="242" height="54" rx="8" fill="#FFF5F5" stroke="#FECACA" stroke-width="1"/>
    <circle cx="20" cy="219" r="8" fill="#FEE2E2"/>
    <text x="20" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">4</text>
    <text x="38" y="212" font-size="12" font-weight="600" fill="#0F172A">Citation measurement</text>
    <text x="38" y="228" font-size="11" fill="#64748B">Track AI mentions, not just rankings</text>
    <text x="38" y="242" font-size="10" fill="#94A3B8">New KPI: brand mention share in AI</text>
  </g>

  <!-- AEO output label -->
  <rect x="454" y="496" width="226" height="28" rx="6" fill="#FEE2E2"/>
  <text x="567" y="515" text-anchor="middle" font-size="12" font-weight="600" fill="#DC2626">Output: Citations + AI-referred traffic</text>

  <!-- CENTER connector + overlap zone -->
  <!-- Arrow from SEO to Center -->
  <line x1="338" y1="310" x2="378" y2="310" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="378,306 386,310 378,314" fill="#94A3B8"/>

  <!-- Arrow from AEO to Center -->
  <line x1="422" y1="310" x2="382" y2="310" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="382,306 374,310 382,314" fill="#94A3B8"/>

  <!-- Center pill -->
  <rect x="350" y="290" width="60" height="40" rx="20" fill="#0F172A" stroke="#E7E5E4" stroke-width="1"/>
  <text x="380" y="306" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">SHARED</text>
  <text x="380" y="320" text-anchor="middle" font-size="9" fill="#94A3B8">LAYER</text>

  <!-- Shared layer note -->
  <text x="380" y="348" text-anchor="middle" font-size="10" fill="#64748B">Structured data</text>
  <text x="380" y="362" text-anchor="middle" font-size="10" fill="#64748B">+ E-E-A-T signals</text>

  <!-- Bottom outcome box -->
  <rect x="120" y="546" width="520" height="54" rx="10" fill="#0F172A"/>
  <text x="380" y="567" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Combined outcome: Impressions that rank + Citations that convert</text>
  <text x="380" y="587" text-anchor="middle" font-size="11" fill="#94A3B8">Organic pipeline that holds even as zero-click search reaches 68%</text>

</svg>
