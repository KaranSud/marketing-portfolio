<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- Background -->
  <rect width="720" height="560" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="360" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">The Proprietary Data Engine</text>
  <text x="360" y="66" text-anchor="middle" font-size="13" fill="#475569">How B2B content teams build original research that AI cannot replicate</text>

  <!-- Step boxes: 4 input types on left, converge to center hub, output on right -->

  <!-- === LEFT COLUMN: INPUTS === -->
  <text x="66" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.2">RAW INPUTS</text>

  <!-- Input 1: Customer Surveys -->
  <rect x="14" y="130" width="104" height="68" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="66" y="155" text-anchor="middle" font-size="22">📋</text>
  <text x="66" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Customer</text>
  <text x="66" y="189" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Surveys</text>

  <!-- Input 2: Customer Interviews -->
  <rect x="14" y="218" width="104" height="68" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="66" y="243" text-anchor="middle" font-size="22">🎙</text>
  <text x="66" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Customer</text>
  <text x="66" y="277" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Interviews</text>

  <!-- Input 3: Campaign Data -->
  <rect x="14" y="306" width="104" height="68" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="66" y="331" text-anchor="middle" font-size="22">📊</text>
  <text x="66" y="351" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Internal</text>
  <text x="66" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Campaign Data</text>

  <!-- Input 4: Competitive Analysis -->
  <rect x="14" y="394" width="104" height="68" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="66" y="419" text-anchor="middle" font-size="22">🔍</text>
  <text x="66" y="439" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Competitive</text>
  <text x="66" y="453" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Analysis</text>

  <!-- Connector lines from inputs to center hub -->
  <line x1="118" y1="164" x2="270" y2="270" stroke="#E7E5E4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="118" y1="252" x2="270" y2="280" stroke="#E7E5E4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="118" y1="340" x2="270" y2="290" stroke="#E7E5E4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="118" y1="428" x2="270" y2="300" stroke="#E7E5E4" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- === CENTER HUB: AI Synthesis === -->
  <circle cx="320" cy="282" r="66" fill="#0F172A"/>
  <text x="320" y="264" text-anchor="middle" font-size="22" fill="#FFFFFF">✦</text>
  <text x="320" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">AI Synthesis</text>
  <text x="320" y="300" text-anchor="middle" font-size="11" fill="#94A3B8">structures and</text>
  <text x="320" y="314" text-anchor="middle" font-size="11" fill="#94A3B8">polishes</text>

  <!-- Connector line from hub to output -->
  <line x1="386" y1="282" x2="450" y2="282" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- === RIGHT COLUMN: OUTPUTS === -->
  <text x="588" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.2">OUTPUTS</text>

  <!-- Output 1 -->
  <rect x="452" y="130" width="126" height="56" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="515" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Benchmark</text>
  <text x="515" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Reports</text>

  <!-- Output 2 -->
  <rect x="452" y="200" width="126" height="56" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="515" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Data-Backed</text>
  <text x="515" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Blog Posts</text>

  <!-- Output 3 -->
  <rect x="452" y="270" width="126" height="56" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="515" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Original</text>
  <text x="515" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Research Papers</text>

  <!-- Output 4 -->
  <rect x="452" y="340" width="126" height="56" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="515" y="366" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Customer</text>
  <text x="515" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Voice Content</text>

  <!-- Output 5 -->
  <rect x="452" y="410" width="126" height="56" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="515" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Competitive</text>
  <text x="515" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Teardowns</text>

  <!-- Connector lines from hub to outputs -->
  <line x1="386" y1="264" x2="452" y2="158" stroke="#E7E5E4" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="386" y1="270" x2="452" y2="228" stroke="#E7E5E4" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="386" y1="290" x2="452" y2="310" stroke="#E7E5E4" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="386" y1="298" x2="452" y2="368" stroke="#E7E5E4" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="386" y1="304" x2="452" y2="438" stroke="#E7E5E4" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Bottom outcome bar -->
  <rect x="14" y="484" width="692" height="60" rx="10" fill="#0F172A"/>
  <text x="360" y="508" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">The Flywheel: Original data earns citations from writers</text>
  <text x="360" y="526" text-anchor="middle" font-size="11" fill="#94A3B8">Citations train AI tools to reference you when answering buyers' questions in your category</text>

  <!-- Key insight callout -->
  <rect x="222" y="362" width="196" height="56" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="320" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Why this matters:</text>
  <text x="320" y="400" text-anchor="middle" font-size="11" fill="#0F172A">AI cannot generate your data.</text>
  <text x="320" y="415" text-anchor="middle" font-size="11" fill="#0F172A">It can only cite it.</text>
</svg>
