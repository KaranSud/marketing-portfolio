<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820" width="700" height="820" style="background:#FAFAF9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;">

  <!-- Background -->
  <rect width="700" height="820" fill="#FAFAF9"/>

  <!-- Header -->
  <rect x="0" y="0" width="700" height="80" fill="#0F172A"/>
  <text x="350" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="2">AI STACK AUDIT FRAMEWORK</text>
  <text x="350" y="58" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">4 Questions Before Buying Another AI Tool</text>

  <!-- Central spine line -->
  <line x1="350" y1="100" x2="350" y2="760" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- STEP 1 -->
  <circle cx="350" cy="120" r="22" fill="#1E40AF"/>
  <text x="350" y="126" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">1</text>

  <rect x="40" y="152" width="620" height="88" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="66" y="180" font-size="13" font-weight="700" fill="#0F172A">Does your current data exist in one place?</text>
  <text x="66" y="200" font-size="12" fill="#475569">Check: can a campaign analyst pull audience + performance + attribution</text>
  <text x="66" y="217" font-size="12" fill="#475569">data from a single system without a spreadsheet bridge?</text>

  <!-- YES / NO branches from Q1 -->
  <rect x="40" y="250" width="270" height="44" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="175" y="269" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">YES</text>
  <text x="175" y="285" text-anchor="middle" font-size="11" fill="#166534">Proceed to Question 2</text>

  <rect x="390" y="250" width="270" height="44" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="525" y="269" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">NO</text>
  <text x="525" y="285" text-anchor="middle" font-size="11" fill="#B91C1C">Fix data first. New tools make this worse.</text>

  <!-- Connector arrows -->
  <line x1="350" y1="240" x2="350" y2="250" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="175" y1="295" x2="175" y2="318" stroke="#16A34A" stroke-width="1.5"/>

  <!-- STEP 2 -->
  <circle cx="350" cy="340" r="22" fill="#1E40AF"/>
  <text x="350" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">2</text>

  <rect x="40" y="372" width="620" height="88" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="66" y="400" font-size="13" font-weight="700" fill="#0F172A">Do you have a named workflow this tool improves?</text>
  <text x="66" y="420" font-size="12" fill="#475569">Not "it could help with content" — a specific, timed workflow with a</text>
  <text x="66" y="437" font-size="12" fill="#475569">current baseline you can measure before and after.</text>

  <rect x="40" y="470" width="270" height="44" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="175" y="489" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">YES</text>
  <text x="175" y="505" text-anchor="middle" font-size="11" fill="#166534">Proceed to Question 3</text>

  <rect x="390" y="470" width="270" height="44" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="525" y="489" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">NO</text>
  <text x="525" y="505" text-anchor="middle" font-size="11" fill="#B91C1C">Define the workflow first. Tool selection is premature.</text>

  <line x1="350" y1="462" x2="350" y2="470" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="175" y1="515" x2="175" y2="538" stroke="#16A34A" stroke-width="1.5"/>

  <!-- STEP 3 -->
  <circle cx="350" cy="560" r="22" fill="#1E40AF"/>
  <text x="350" y="566" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">3</text>

  <rect x="40" y="592" width="620" height="88" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="66" y="620" font-size="13" font-weight="700" fill="#0F172A">Does this tool connect natively to tools you already use?</text>
  <text x="66" y="640" font-size="12" fill="#475569">Or will someone on your team become the integration layer —</text>
  <text x="66" y="657" font-size="12" fill="#475569">copying outputs, reformatting, bridging via Zapier?</text>

  <rect x="40" y="690" width="270" height="44" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="175" y="709" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">YES, native</text>
  <text x="175" y="725" text-anchor="middle" font-size="11" fill="#166534">Proceed to Question 4</text>

  <rect x="390" y="690" width="270" height="44" rx="6" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5"/>
  <text x="525" y="709" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">MANUAL BRIDGE</text>
  <text x="525" y="725" text-anchor="middle" font-size="11" fill="#92400E">Count full integration labor cost in ROI model.</text>

  <line x1="350" y1="682" x2="350" y2="690" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="175" y1="735" x2="175" y2="760" stroke="#16A34A" stroke-width="1.5"/>

  <!-- STEP 4 -->
  <circle cx="350" cy="760" r="22" fill="#1E40AF"/>
  <text x="350" y="766" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">4</text>

  <!-- Final outcome box -->
  <rect x="40" y="792" width="620" height="20" rx="0" fill="#FAFAF9"/>
  <text x="350" y="808" text-anchor="middle" font-size="11" fill="#64748B">Can you run a 30-day test, measure the before/after, and kill it if the delta is zero?</text>

</svg>
