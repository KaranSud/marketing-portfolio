<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2B Buyer Interaction Channels: 2016 vs 2024</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FAFAF9;
    --text: #0F172A;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
    --border: #E7E5E4;
    --grid: #E2E8F0;
    --accent: #DC2626;
    --accent-light: rgba(220,38,38,0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F172A;
      --surface: #1E293B;
      --text: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --border: #334155;
      --grid: #1E293B;
      --accent-light: rgba(220,38,38,0.18);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F172A;
    --surface: #1E293B;
    --text: #F1F5F9;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;
    --border: #334155;
    --grid: #1E293B;
    --accent-light: rgba(220,38,38,0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    padding: 32px 28px 24px;
    min-height: 340px;
  }
  .chart-header { margin-bottom: 24px; }
  .chart-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 4px;
  }
  .chart-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .chart-wrap { position: relative; height: 260px; }
  .source {
    margin-top: 14px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .legend {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="chart-header">
  <div class="chart-title">B2B Buyers Now Use 10 Channels — Up from 5 in 2016</div>
  <div class="chart-subtitle">Average interaction channels used across all stages of the B2B buying journey</div>
</div>
<div class="legend">
  <div class="legend-item">
    <div class="legend-dot" style="background:#94A3B8;"></div>
    <span>2016 baseline</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#DC2626;"></div>
    <span>2024 (latest McKinsey B2B Pulse)</span>
  </div>
</div>
<div class="chart-wrap">
  <canvas id="ch1"></canvas>
</div>
<div class="source">Source: McKinsey B2B Pulse Survey, 2024 — mckinsey.com</div>

<script>
const isDark = () =>
  document.documentElement.dataset.theme === 'dark' ||
  (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);

const getColor = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const labels = [
  'In-person\nmeetings', 'Video\ncalls', 'Supplier\nwebsite', 'Email\noutreach',
  'Industry\nevents', 'Social\nmedia', 'AI /\nchatbot', 'Peer\nreviews',
  'Online\ncommunity', 'Self-serve\ntrial'
];
const data2016 = [4.2, 0.4, 3.8, 3.5, 2.8, 1.5, 0, 1.8, 0.8, 0.4];
const data2024 = [5.1, 6.8, 8.2, 7.0, 5.9, 7.4, 6.1, 7.8, 6.5, 6.2];

const ctx = document.getElementById('ch1').getContext('2d');
const chart = new Chart(ctx, {
  type: 'bar',
  data: {
    labels: labels.map(l => l.split('\n')),
    datasets: [
      {
        label: '2016',
        data: data2016,
        backgroundColor: 'rgba(148,163,184,0.55)',
        borderColor: 'rgba(148,163,184,0.8)',
        borderWidth: 1,
        borderRadius: 3,
      },
      {
        label: '2024',
        data: data2024,
        backgroundColor: 'rgba(220,38,38,0.82)',
        borderColor: '#DC2626',
        borderWidth: 1,
        borderRadius: 3,
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: isDark() ? '#1E293B' : '#0F172A',
        titleColor: '#F1F5F9',
        bodyColor: '#94A3B8',
        padding: 10,
        callbacks: {
          title: (items) => items[0].label.join(' '),
          label: (item) => ` ${item.dataset.label}: ${item.parsed.y.toFixed(1)} channels used`
        }
      }
    },
    scales: {
      x: {
        grid: { color: 'transparent' },
        ticks: {
          color: getColor('--text-muted') || '#94A3B8',
          font: { size: 10 },
          maxRotation: 0
        },
        border: { color: getColor('--grid') || '#E2E8F0' }
      },
      y: {
        min: 0,
        max: 10,
        grid: { color: getColor('--grid') || '#E2E8F0' },
        ticks: {
          color: getColor('--text-muted') || '#94A3B8',
          font: { size: 10 },
          callback: (v) => v + ' ch'
        },
        border: { color: 'transparent' }
      }
    }
  }
});
</script>
</body>
</html>
