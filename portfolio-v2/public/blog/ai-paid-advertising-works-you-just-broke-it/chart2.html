<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US AI-Powered Ad Spend Growth</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --text: #0F172A;
    --secondary: #475569;
    --muted: #94A3B8;
    --mid: #64748B;
    --accent: #DC2626;
    --border: #E7E5E4;
    --grid: #E2E8F0;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .chart-container {
    width: 100%;
    max-width: 700px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 32px 24px;
  }
  h2 {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }
  p.subtitle {
    font-size: 13px;
    color: var(--secondary);
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .canvas-wrap { position: relative; width: 100%; }
  .badge {
    display: inline-block;
    background: #FEF2F2;
    color: #DC2626;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    margin-top: 12px;
  }
  .source {
    margin-top: 20px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--grid);
    padding-top: 12px;
  }
</style>
</head>
<body>
<div class="chart-container">
  <h2>U.S. AI-Powered Ad Spend, 2022–2026</h2>
  <p class="subtitle">AI-driven buying, bidding, and creative automation — billions USD</p>
  <div class="canvas-wrap">
    <canvas id="area" aria-label="Area chart showing U.S. AI-powered ad spend growth 2022-2026"></canvas>
  </div>
  <div class="badge">+63% YoY in 2026</div>
  <div class="source">Source: Madison and Wall estimate reported by eMarketer, April 2026. 2022–2024 figures are extrapolated from reported CAGR; treat as estimates.</div>
</div>

<script>
const ctx = document.getElementById('area').getContext('2d');

const gradient = ctx.createLinearGradient(0, 0, 0, 280);
gradient.addColorStop(0, 'rgba(220, 38, 38, 0.18)');
gradient.addColorStop(1, 'rgba(220, 38, 38, 0.01)');

new Chart(ctx, {
  type: 'line',
  data: {
    labels: ['2022', '2023', '2024', '2025', '2026'],
    datasets: [{
      label: 'AI-Powered Ad Spend ($B)',
      data: [12.9, 18.4, 25.0, 35.0, 57.0],
      borderColor: '#DC2626',
      backgroundColor: gradient,
      borderWidth: 2.5,
      pointBackgroundColor: '#DC2626',
      pointBorderColor: '#FFFFFF',
      pointBorderWidth: 2,
      pointRadius: 5,
      pointHoverRadius: 7,
      fill: true,
      tension: 0.4
    }]
  },
  options: {
    responsive: true,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#0F172A',
        titleColor: '#94A3B8',
        bodyColor: '#FFFFFF',
        padding: 12,
        callbacks: {
          label: (ctx) => ` $${ctx.parsed.y}B`
        }
      }
    },
    scales: {
      x: {
        grid: { color: '#E2E8F0', drawTicks: false },
        border: { dash: [4, 4], color: 'transparent' },
        ticks: { color: '#475569', font: { size: 12 } }
      },
      y: {
        min: 0,
        max: 65,
        grid: { color: '#E2E8F0', drawTicks: false },
        border: { color: 'transparent' },
        ticks: {
          color: '#475569',
          font: { size: 12 },
          callback: (v) => `$${v}B`
        }
      }
    }
  }
});
</script>
</body>
</html>
