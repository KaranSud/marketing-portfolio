<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Per Email: Behavioral Triggers vs. Batch Sends</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --text: #0F172A;
    --secondary: #475569;
    --muted: #94A3B8;
    --mid: #64748B;
    --grid: #E2E8F0;
    --border: #E7E5E4;
    --accent: #DC2626;
    --bar-behavioral: #0F172A;
    --bar-batch: #94A3B8;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F172A;
      --text: #F8FAFC;
      --secondary: #CBD5E1;
      --muted: #64748B;
      --mid: #94A3B8;
      --grid: #1E293B;
      --border: #334155;
      --bar-behavioral: #F8FAFC;
      --bar-batch: #475569;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F172A;
    --text: #F8FAFC;
    --secondary: #CBD5E1;
    --muted: #64748B;
    --mid: #94A3B8;
    --grid: #1E293B;
    --border: #334155;
    --bar-behavioral: #F8FAFC;
    --bar-batch: #475569;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: var(--font);
    padding: 24px 16px;
  }
  .chart-wrapper {
    max-width: 680px;
    margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px 24px 16px;
    background: var(--bg);
  }
  .chart-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .chart-subtitle {
    font-size: 12px;
    color: var(--secondary);
    margin-bottom: 20px;
  }
  .chart-container {
    position: relative;
    height: 300px;
  }
  .legend {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--secondary);
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .source {
    font-size: 10px;
    color: var(--muted);
    margin-top: 12px;
    text-align: right;
  }
  .accent-label {
    color: var(--accent);
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="chart-wrapper">
  <div class="chart-title">Revenue Per Email Sent: Behavioral Triggers vs. Batch Campaigns</div>
  <div class="chart-subtitle">Automated behavioral sends generate up to 16× more revenue per message than campaign blasts</div>
  <div class="chart-container">
    <canvas id="chart1"></canvas>
  </div>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#0F172A"></div>
      Revenue per send ($)
    </div>
  </div>
  <div class="source">Source: Omnisend 2025 eCommerce Marketing Report (150,000 brands, 27B sends)</div>
</div>
<script>
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const textColor = isDark ? '#F8FAFC' : '#0F172A';
  const gridColor = isDark ? '#1E293B' : '#E2E8F0';
  const mutedColor = isDark ? '#94A3B8' : '#94A3B8';

  const labels = [
    'Cart Abandonment',
    'Browse Abandonment',
    'Post-Purchase',
    'Win-Back',
    'Welcome Series',
    'Batch Campaign'
  ];
  const data = [4.72, 3.38, 2.91, 2.14, 1.88, 0.18];
  const colors = [
    '#DC2626', // cart - accent red (highest impact)
    '#0F172A',
    '#0F172A',
    '#475569',
    '#475569',
    '#94A3B8'  // batch - muted
  ];

  const ctx = document.getElementById('chart1').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Revenue per send ($)',
        data: data,
        backgroundColor: colors,
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'x',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => `$${ctx.parsed.y.toFixed(2)} per send`
          }
        }
      },
      scales: {
        x: {
          grid: { color: gridColor },
          ticks: {
            color: mutedColor,
            font: { size: 11, family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif' },
            maxRotation: 30,
            minRotation: 30
          },
          border: { color: gridColor }
        },
        y: {
          grid: { color: gridColor },
          ticks: {
            color: mutedColor,
            font: { size: 11, family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif' },
            callback: val => `$${val.toFixed(2)}`
          },
          border: { color: gridColor }
        }
      }
    }
  });
</script>
</body>
</html>
