<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="960" fill="#FAFAF9"/>

  <!-- Header band -->
  <rect x="0" y="0" width="800" height="112" fill="#0F172A"/>

  <!-- Title -->
  <text x="400" y="46" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">The Authenticity Arbitrage</text>
  <text x="400" y="72" text-anchor="middle" fill="#94A3B8" font-size="13">A Decision Framework for Social Content in the Age of AI Saturation</text>
  <text x="400" y="96" text-anchor="middle" fill="#64748B" font-size="11">Source: karansud.substack.com — July 2026</text>

  <!-- Section 1: The Landscape (stats row) -->
  <text x="44" y="144" fill="#0F172A" font-size="12" font-weight="700" letter-spacing="1">THE CURRENT LANDSCAPE</text>

  <!-- Stat boxes -->
  <!-- Box 1 -->
  <rect x="40" y="156" width="216" height="88" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="148" y="186" text-anchor="middle" fill="#DC2626" font-size="32" font-weight="800">41%</text>
  <text x="148" y="205" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="600">of LinkedIn long-form</text>
  <text x="148" y="220" text-anchor="middle" fill="#475569" font-size="11">posts are fully AI-generated</text>
  <text x="148" y="234" text-anchor="middle" fill="#94A3B8" font-size="10">Pangram, July 2026</text>

  <!-- Box 2 -->
  <rect x="292" y="156" width="216" height="88" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="400" y="186" text-anchor="middle" fill="#DC2626" font-size="32" font-weight="800">45%</text>
  <text x="400" y="205" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="600">less engagement</text>
  <text x="400" y="220" text-anchor="middle" fill="#475569" font-size="11">on AI-authored vs. human posts</text>
  <text x="400" y="234" text-anchor="middle" fill="#94A3B8" font-size="10">Originality.AI, 2025</text>

  <!-- Box 3 -->
  <rect x="544" y="156" width="216" height="88" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="652" y="186" text-anchor="middle" fill="#DC2626" font-size="32" font-weight="800">73%</text>
  <text x="652" y="205" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="600">of consumers say trust</text>
  <text x="652" y="220" text-anchor="middle" fill="#475569" font-size="11">rises with cultural authenticity</text>
  <text x="652" y="234" text-anchor="middle" fill="#94A3B8" font-size="10">Edelman Trust Barometer, 2025</text>

  <!-- Section 2: Decision Tree header -->
  <text x="44" y="278" fill="#0F172A" font-size="12" font-weight="700" letter-spacing="1">THE AUTHENTICITY ARBITRAGE DECISION TREE</text>

  <!-- Start node -->
  <rect x="300" y="290" width="200" height="48" rx="24" fill="#0F172A"/>
  <text x="400" y="318" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="600">A piece of social content</text>

  <!-- Arrow down -->
  <line x1="400" y1="338" x2="400" y2="370" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="400,376 394,366 406,366" fill="#94A3B8"/>

  <!-- Decision 1 -->
  <rect x="236" y="376" width="328" height="52" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="400" y="400" text-anchor="middle" fill="#0F172A" font-size="13" font-weight="600">Does it carry a genuine point of view</text>
  <text x="400" y="418" text-anchor="middle" fill="#475569" font-size="12">that only your brand could have said?</text>

  <!-- Arrow YES left -->
  <line x1="236" y1="402" x2="168" y2="402" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="162,402 172,396 172,408" fill="#94A3B8"/>
  <text x="196" y="396" text-anchor="middle" fill="#475569" font-size="11">YES</text>

  <!-- Arrow NO right -->
  <line x1="564" y1="402" x2="632" y2="402" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="638,402 628,396 628,408" fill="#94A3B8"/>
  <text x="604" y="396" text-anchor="middle" fill="#475569" font-size="11">NO</text>

  <!-- Left branch: Next question -->
  <rect x="48" y="428" width="224" height="52" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="160" y="452" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="600">Is it based on real data,</text>
  <text x="160" y="468" text-anchor="middle" fill="#475569" font-size="11">experience, or original observation?</text>
  <!-- Arrow down left -->
  <line x1="160" y1="428" x2="160" y2="402" stroke="#94A3B8" stroke-width="2"/>

  <!-- Right branch: STOP box -->
  <rect x="630" y="378" width="122" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="691" y="398" text-anchor="middle" fill="#DC2626" font-size="13" font-weight="700">STOP.</text>
  <text x="691" y="416" text-anchor="middle" fill="#DC2626" font-size="10">Rethink the angle</text>

  <!-- YES/NO from left branch -->
  <line x1="160" y1="480" x2="160" y2="520" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="160,526 154,516 166,516" fill="#94A3B8"/>

  <!-- Decision 2 -->
  <rect x="44" y="526" width="232" height="52" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="160" y="550" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="600">Does AI assist the craft</text>
  <text x="160" y="566" text-anchor="middle" fill="#475569" font-size="11">without replacing the thinking?</text>

  <!-- Left: NO from Decision 2 -->
  <line x1="44" y1="552" x2="0" y2="552" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Omit per complexity: just label -->
  <text x="22" y="548" text-anchor="middle" fill="#DC2626" font-size="10">NO</text>

  <!-- Right: YES -->
  <line x1="276" y1="552" x2="320" y2="552" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="326,552 316,546 316,558" fill="#94A3B8"/>
  <text x="300" y="546" text-anchor="middle" fill="#475569" font-size="11">YES</text>

  <!-- Decision 3: Is it human-approved? -->
  <rect x="320" y="528" width="232" height="52" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="436" y="552" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="600">Has a human reviewed, edited,</text>
  <text x="436" y="568" text-anchor="middle" fill="#475569" font-size="11">and added their voice to it?</text>

  <!-- Arrow down from Decision 3 -->
  <line x1="436" y1="580" x2="436" y2="616" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="436,622 430,612 442,612" fill="#94A3B8"/>

  <!-- YES -> Publish box -->
  <rect x="336" y="622" width="200" height="52" rx="8" fill="#0F172A"/>
  <text x="436" y="643" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600">Publish with confidence.</text>
  <text x="436" y="660" text-anchor="middle" fill="#94A3B8" font-size="11">This is the authenticity arbitrage.</text>

  <!-- Arrow to Three Moves section -->
  <line x1="436" y1="674" x2="436" y2="706" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Section 3: Three Moves -->
  <text x="44" y="728" fill="#0F172A" font-size="12" font-weight="700" letter-spacing="1">THE THREE MOVES</text>

  <!-- Move 1 -->
  <rect x="40" y="738" width="226" height="108" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="40" y="738" width="226" height="4" rx="2" fill="#0F172A"/>
  <text x="60" y="768" fill="#0F172A" font-size="13" font-weight="700">01 — Raise the Proprietary Bar</text>
  <text x="60" y="790" fill="#475569" font-size="11.5">Share internal data, contrarian</text>
  <text x="60" y="807" fill="#475569" font-size="11.5">takes, or earned insights that</text>
  <text x="60" y="824" fill="#475569" font-size="11.5">no LLM can generate for you.</text>
  <text x="60" y="838" fill="#94A3B8" font-size="10">AI can draft. Only you can originate.</text>

  <!-- Move 2 -->
  <rect x="287" y="738" width="226" height="108" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="287" y="738" width="226" height="4" rx="2" fill="#DC2626"/>
  <text x="307" y="768" fill="#0F172A" font-size="13" font-weight="700">02 — Volume Down, Signal Up</text>
  <text x="307" y="790" fill="#475569" font-size="11.5">Publish half as much. Make</text>
  <text x="307" y="807" fill="#475569" font-size="11.5">every post worth saving.</text>
  <text x="307" y="824" fill="#475569" font-size="11.5">Depth score beats frequency.</text>
  <text x="307" y="838" fill="#94A3B8" font-size="10">LinkedIn now measures dwell, not clicks.</text>

  <!-- Move 3 -->
  <rect x="534" y="738" width="226" height="108" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="534" y="738" width="226" height="4" rx="2" fill="#64748B"/>
  <text x="554" y="768" fill="#0F172A" font-size="13" font-weight="700">03 — Build the Contrast Signal</text>
  <text x="554" y="790" fill="#475569" font-size="11.5">Be visible in the formats AI</text>
  <text x="554" y="807" fill="#475569" font-size="11.5">cannot fake: video, events, live</text>
  <text x="554" y="824" fill="#475569" font-size="11.5">commentary, and community.</text>
  <text x="554" y="838" fill="#94A3B8" font-size="10">7 in 10 marketers are pivoting to IRL.</text>

  <!-- Footer -->
  <rect x="0" y="900" width="800" height="60" fill="#0F172A"/>
  <text x="400" y="924" text-anchor="middle" fill="#64748B" font-size="11">The window for the authenticity arbitrage is open right now.</text>
  <text x="400" y="942" text-anchor="middle" fill="#94A3B8" font-size="11">karansud.substack.com | For senior marketers, SaaS founders, and marketing ops leaders</text>

</svg>
