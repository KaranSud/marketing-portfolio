<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" style="background:#FAFAF9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;">
  <!-- Background -->
  <rect width="760" height="480" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="380" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">The Two-Phase B2B Buying Model</text>
  <text x="380" y="57" text-anchor="middle" font-size="11" fill="#475569">What actually happens before your first demo request</text>

  <!-- PHASE 1 BOX -->
  <rect x="40" y="80" width="300" height="310" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="190" y="107" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF" letter-spacing="0.08em">PHASE 1 — AI &amp; PEER RESEARCH</text>
  <text x="190" y="122" text-anchor="middle" font-size="10" fill="#475569">Day −124 to Day 0  ·  Rep-free zone</text>

  <!-- Phase 1 steps -->
  <!-- Step 1 -->
  <circle cx="72" cy="160" r="14" fill="#1E40AF"/>
  <text x="72" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
  <text x="97" y="156" font-size="11" font-weight="600" fill="#0F172A">Internal problem identified</text>
  <text x="97" y="171" font-size="10" fill="#475569">Budget owner names the gap</text>

  <!-- Step 2 -->
  <circle cx="72" cy="215" r="14" fill="#1E40AF"/>
  <text x="72" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
  <text x="97" y="211" font-size="11" font-weight="600" fill="#0F172A">AI tools queried</text>
  <text x="97" y="226" font-size="10" fill="#475569">ChatGPT, Claude, Perplexity</text>
  <text x="97" y="239" font-size="10" fill="#475569">set initial vendor priors</text>

  <!-- Step 3 -->
  <circle cx="72" cy="275" r="14" fill="#1E40AF"/>
  <text x="72" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
  <text x="97" y="271" font-size="11" font-weight="600" fill="#0F172A">Peer validation</text>
  <text x="97" y="286" font-size="10" fill="#475569">Slack communities, LinkedIn</text>
  <text x="97" y="299" font-size="10" fill="#475569">DMs, G2 reviews</text>

  <!-- Step 4 -->
  <circle cx="72" cy="340" r="14" fill="#DC2626"/>
  <text x="72" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>
  <text x="97" y="336" font-size="11" font-weight="600" fill="#0F172A">Shortlist set (avg. 2.5 vendors)</text>
  <text x="97" y="351" font-size="10" fill="#475569">Winning vendor already ranked #1</text>
  <text x="97" y="364" font-size="10" fill="#DC2626">in 80% of deals at this stage</text>

  <!-- Connector dots for Phase 1 -->
  <line x1="72" y1="174" x2="72" y2="201" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="72" y1="229" x2="72" y2="261" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="72" y1="289" x2="72" y2="326" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- TRANSITION ARROW -->
  <line x1="340" y1="235" x2="420" y2="235" stroke="#64748B" stroke-width="2"/>
  <polygon points="416,229 428,235 416,241" fill="#64748B"/>
  <text x="380" y="225" text-anchor="middle" font-size="9" fill="#64748B">First contact</text>
  <text x="380" y="253" text-anchor="middle" font-size="9" fill="#64748B">61% complete</text>

  <!-- PHASE 2 BOX -->
  <rect x="420" y="80" width="300" height="310" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="570" y="107" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626" letter-spacing="0.08em">PHASE 2 — HUMAN VALIDATION</text>
  <text x="570" y="122" text-anchor="middle" font-size="10" fill="#475569">Day 0 to close  ·  Rep-led zone</text>

  <!-- Phase 2 steps -->
  <!-- Step 5 -->
  <circle cx="452" cy="160" r="14" fill="#DC2626"/>
  <text x="452" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">5</text>
  <text x="477" y="156" font-size="11" font-weight="600" fill="#0F172A">First vendor contact</text>
  <text x="477" y="171" font-size="10" fill="#475569">Rep receives inbound — buyer</text>
  <text x="477" y="184" font-size="10" fill="#475569">already has a view</text>

  <!-- Step 6 -->
  <circle cx="452" cy="230" r="14" fill="#DC2626"/>
  <text x="452" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">6</text>
  <text x="477" y="226" font-size="11" font-weight="600" fill="#0F172A">Validation call (not discovery)</text>
  <text x="477" y="241" font-size="10" fill="#475569">69% want reps to confirm</text>
  <text x="477" y="254" font-size="10" fill="#475569">AI-generated insights</text>

  <!-- Step 7 -->
  <circle cx="452" cy="300" r="14" fill="#DC2626"/>
  <text x="452" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">7</text>
  <text x="477" y="296" font-size="11" font-weight="600" fill="#0F172A">Committee sign-off</text>
  <text x="477" y="311" font-size="10" fill="#475569">Avg. 11.2 stakeholders; 73%</text>
  <text x="477" y="324" font-size="10" fill="#475569">comfortable with $50K+ online</text>

  <!-- Step 8 -->
  <circle cx="452" cy="360" r="14" fill="#334155"/>
  <text x="452" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">8</text>
  <text x="477" y="356" font-size="11" font-weight="600" fill="#0F172A">Close</text>
  <text x="477" y="371" font-size="10" fill="#475569">Winner was set in phase one</text>

  <!-- Connector dots for Phase 2 -->
  <line x1="452" y1="174" x2="452" y2="216" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="452" y1="244" x2="452" y2="286" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="452" y1="314" x2="452" y2="346" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- BOTTOM IMPLICATION BAR -->
  <rect x="40" y="410" width="680" height="52" rx="8" fill="#0F172A"/>
  <text x="380" y="431" text-anchor="middle" font-size="11" font-weight="700" fill="#F1F5F9">IMPLICATION FOR MARKETING</text>
  <text x="380" y="450" text-anchor="middle" font-size="10" fill="#94A3B8">Win phase one with AI-readable content, G2 reviews, and community presence — before the buyer ever visits your site.</text>

  <!-- Footer -->
  <text x="380" y="475" text-anchor="middle" font-size="9" fill="#94A3B8">Sources: 6sense 2025 B2B Buyer Experience Report; Gartner 2026; McKinsey B2B Pulse 2026; Forrester B2B Buying Study 2026</text>
</svg>
