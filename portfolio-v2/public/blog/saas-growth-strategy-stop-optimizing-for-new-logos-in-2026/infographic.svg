  <polygon points="395,236 405,236 400,244" fill="#CBD5E1"/>

  <rect x="303" y="244" width="194" height="64" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="327" cy="276" r="14" fill="#E2E8F0"/>
  <text x="327" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">2</text>
  <text x="349" y="270" font-size="11" font-weight="600" fill="#0F172A">Adjacent Need Surfaced</text>
  <text x="349" y="286" font-size="10" fill="#64748B">QBR or usage data reveals</text>
  <text x="349" y="300" font-size="10" fill="#64748B">natural next-product need</text>

  <line x1="400" y1="308" x2="400" y2="326" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="395,324 405,324 400,332" fill="#CBD5E1"/>

  <rect x="303" y="332" width="194" height="64" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="327" cy="364" r="14" fill="#E2E8F0"/>
  <text x="327" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">3</text>
  <text x="349" y="358" font-size="11" font-weight="600" fill="#0F172A">Second Product Pitched</text>
  <text x="349" y="374" font-size="10" fill="#64748B">Lands 2x faster than</text>
  <text x="349" y="388" font-size="10" fill="#64748B">primary product acquisition</text>

  <line x1="400" y1="396" x2="400" y2="414" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="395,412 405,412 400,420" fill="#CBD5E1"/>

  <rect x="303" y="420" width="194" height="44" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="400" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Lower CAC Close</text>
  <text x="400" y="454" text-anchor="middle" font-size="10" fill="#DC2626">fraction of new-logo cost</text>

  <!-- === COLUMN 3: Seat Expansion === -->
