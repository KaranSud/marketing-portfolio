<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Three SaaS expansion motions that compound NRR">
  <title>Three Expansion Motions That Compound</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="#FAFAF9" rx="12"/>

  <!-- Header -->
  <text x="400" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Three Expansion Motions That Compound</text>
  <text x="400" y="66" text-anchor="middle" font-size="12" fill="#64748B">The structural levers behind 110%+ NRR</text>

  <!-- Divider -->
  <line x1="40" y1="82" x2="760" y2="82" stroke="#E7E5E4" stroke-width="1"/>

  <!-- === COLUMN 1: Usage-Based Triggers === -->
  <!-- Column header background -->
  <rect x="40" y="96" width="222" height="42" rx="6" fill="#0F172A"/>
  <text x="151" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">01</text>
  <text x="151" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Usage-Based Triggers</text>

  <!-- Step boxes col 1 -->
  <!-- Step 1 -->
  <rect x="54" y="156" width="194" height="64" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="78" cy="188" r="14" fill="#E2E8F0"/>
  <text x="78" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">1</text>
  <text x="100" y="182" font-size="11" font-weight="600" fill="#0F172A">Product Usage Data</text>
  <text x="100" y="198" font-size="10" fill="#64748B">Seats, events, API calls tracked</text>
  <text x="100" y="212" font-size="10" fill="#64748B">in real time</text>

  <!-- Arrow -->
  <line x1="151" y1="220" x2="151" y2="238" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="146,236 156,236 151,244" fill="#CBD5E1"/>

  <!-- Step 2 -->
  <rect x="54" y="244" width="194" height="64" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="78" cy="276" r="14" fill="#E2E8F0"/>
  <text x="78" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">2</text>
  <text x="100" y="270" font-size="11" font-weight="600" fill="#0F172A">Threshold Alert</text>
  <text x="100" y="286" font-size="10" fill="#64748B">Automated trigger fires when</text>
  <text x="100" y="300" font-size="10" fill="#64748B">customer hits 80% of limit</text>

  <!-- Arrow -->
  <line x1="151" y1="308" x2="151" y2="326" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="146,324 156,324 151,332" fill="#CBD5E1"/>

  <!-- Step 3 -->
  <rect x="54" y="332" width="194" height="64" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="78" cy="364" r="14" fill="#E2E8F0"/>
  <text x="78" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">3</text>
  <text x="100" y="358" font-size="11" font-weight="600" fill="#0F172A">CS Engagement</text>
  <text x="100" y="374" font-size="10" fill="#64748B">Timely outreach with context</text>
  <text x="100" y="388" font-size="10" fill="#64748B">already in hand</text>

