  <text x="649" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">03</text>
  <text x="649" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Seat Expansion Architecture</text>

