  <circle cx="327" cy="188" r="14" fill="#E2E8F0"/>
  <text x="327" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">1</text>
  <text x="349" y="182" font-size="11" font-weight="600" fill="#0F172A">Trust Established</text>
  <text x="349" y="198" font-size="10" fill="#64748B">Customer proven, contracts</text>
  <text x="349" y="212" font-size="10" fill="#64748B">live, workflow integrated</text>

