  <circle cx="576" cy="188" r="14" fill="#E2E8F0"/>
  <text x="576" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">1</text>
  <text x="598" y="182" font-size="11" font-weight="600" fill="#0F172A">Champion Mapped</text>
  <text x="598" y="198" font-size="10" fill="#64748B">Power users and internal</text>
  <text x="598" y="212" font-size="10" fill="#64748B">advocates identified</text>

  <line x1="649" y1="220" x2="649" y2="238" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="644,236 654,236 649,244" fill="#CBD5E1"/>

  <rect x="552" y="244" width="194" height="64" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="576" cy="276" r="14" fill="#E2E8F0"/>
  <text x="576" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">2</text>
  <text x="598" y="270" font-size="11" font-weight="600" fill="#0F172A">Adoption Tracked</text>
  <text x="598" y="286" font-size="10" fill="#64748B">Low-utilization accounts</text>
  <text x="598" y="300" font-size="10" fill="#64748B">flagged proactively</text>

  <line x1="649" y1="308" x2="649" y2="326" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="644,324 654,324 649,332" fill="#CBD5E1"/>

  <rect x="552" y="332" width="194" height="64" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="576" cy="364" r="14" fill="#E2E8F0"/>
  <text x="576" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">3</text>
  <text x="598" y="358" font-size="11" font-weight="600" fill="#0F172A">Adjacent Team Warm Intro</text>
  <text x="598" y="374" font-size="10" fill="#64748B">Champion introduces CS to</text>
  <text x="598" y="388" font-size="10" fill="#64748B">neighboring team</text>

  <line x1="649" y1="396" x2="649" y2="414" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="644,412 654,412 649,420" fill="#CBD5E1"/>

  <rect x="552" y="420" width="194" height="44" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="649" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Organic Seat Growth</text>
  <text x="649" y="454" text-anchor="middle" font-size="10" fill="#DC2626">without a sales cycle</text>

  <!-- Bottom bar -->
  <rect x="40" y="484" width="720" height="56" rx="6" fill="#0F172A"/>
  <text x="400" y="508" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">All three motions compound into NRR above 110%</text>
  <text x="400" y="526" text-anchor="middle" font-size="11" fill="#94A3B8">None require new customer acquisition. All require investment in post-sale infrastructure.</text>

