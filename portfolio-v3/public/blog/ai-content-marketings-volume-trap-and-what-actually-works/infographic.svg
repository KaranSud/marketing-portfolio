<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#FAFAF9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;">

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAF9"/>

  <!-- Title block -->
  <rect x="0" y="0" width="800" height="72" fill="#0F172A"/>
  <text x="400" y="30" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700">The AI Content Strategy Decision Tree</text>
  <text x="400" y="54" text-anchor="middle" fill="#94A3B8" font-size="12">How to route each content piece for maximum differentiation</text>

  <!-- Red accent bar -->
  <rect x="0" y="592" width="800" height="8" fill="#DC2626"/>

  <!-- DECISION NODE 1: Start -->
  <ellipse cx="400" cy="120" rx="120" ry="32" fill="#0F172A" stroke="#E7E5E4" stroke-width="1"/>
  <text x="400" y="115" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="600">New content piece</text>
  <text x="400" y="132" text-anchor="middle" fill="#94A3B8" font-size="11">What's the primary authority source?</text>

  <!-- Arrow down from node 1 -->
  <line x1="400" y1="152" x2="400" y2="175" stroke="#475569" stroke-width="1.5"/>
  <polygon points="396,172 400,180 404,172" fill="#475569"/>

  <!-- DECISION NODE 2: Authority type -->
  <rect x="270" y="178" width="260" height="48" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="400" y="199" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="600">Does this require original data</text>
  <text x="400" y="216" text-anchor="middle" fill="#0F172A" font-size="12">or lived experience?</text>

  <!-- YES branch left -->
  <line x1="270" y1="202" x2="170" y2="202" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="170" y1="202" x2="170" y2="285" stroke="#475569" stroke-width="1.5"/>
  <polygon points="166,282 170,290 174,282" fill="#475569"/>
  <text x="215" y="196" text-anchor="middle" fill="#475569" font-size="10">YES</text>

  <!-- NO branch right -->
  <line x1="530" y1="202" x2="630" y2="202" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="630" y1="202" x2="630" y2="285" stroke="#475569" stroke-width="1.5"/>
  <polygon points="626,282 630,290 634,282" fill="#475569"/>
  <text x="580" y="196" text-anchor="middle" fill="#475569" font-size="10">NO</text>

  <!-- LEFT BRANCH: Original/Experience content -->
  <rect x="90" y="290" width="160" height="68" rx="6" fill="#DC2626"/>
  <text x="170" y="313" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">High-value piece</text>
  <text x="170" y="330" text-anchor="middle" fill="#FFD6D6" font-size="10">Original data OR</text>
  <text x="170" y="344" text-anchor="middle" fill="#FFD6D6" font-size="10">named expert perspective</text>

  <!-- LEFT outcomes -->
  <line x1="170" y1="358" x2="170" y2="400" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="166,397 170,405 174,397" fill="#DC2626"/>
  <rect x="100" y="405" width="140" height="52" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="170" y="425" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="600">Human-led production</text>
  <text x="170" y="439" text-anchor="middle" fill="#475569" font-size="9">AI assists: research, structure</text>
  <text x="170" y="452" text-anchor="middle" fill="#475569" font-size="9">Human owns: angle, evidence</text>

  <!-- LEFT result -->
  <line x1="170" y1="457" x2="170" y2="490" stroke="#475569" stroke-width="1.5"/>
  <polygon points="166,487 170,495 174,487" fill="#475569"/>
  <rect x="100" y="495" width="140" height="38" rx="6" fill="#0F172A"/>
  <text x="170" y="511" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="600">5.44x traffic potential</text>
  <text x="170" y="524" text-anchor="middle" fill="#94A3B8" font-size="9">AI citation-eligible content</text>

  <!-- RIGHT BRANCH: Synthesis content -->
  <rect x="550" y="290" width="160" height="68" rx="6" fill="#E2E8F0"/>
  <text x="630" y="313" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="600">Synthesis piece</text>
  <text x="630" y="330" text-anchor="middle" fill="#475569" font-size="10">Explains, aggregates</text>
  <text x="630" y="344" text-anchor="middle" fill="#475569" font-size="10">or reformats existing info</text>

  <!-- RIGHT question -->
  <line x1="630" y1="358" x2="630" y2="395" stroke="#475569" stroke-width="1.5"/>
  <polygon points="626,392 630,400 634,392" fill="#475569"/>
  <rect x="555" y="400" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="630" y="419" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="600">Does it have a</text>
  <text x="630" y="434" text-anchor="middle" fill="#0F172A" font-size="11">strong POV?</text>

  <!-- NO to no-POV -->
  <line x1="555" y1="422" x2="490" y2="422" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 2"/>
  <polygon points="493,418 485,422 493,426" fill="#94A3B8"/>
  <text x="517" y="416" text-anchor="middle" fill="#94A3B8" font-size="9">NO</text>
  <rect x="370" y="410" width="114" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="427" y="427" text-anchor="middle" fill="#64748B" font-size="9" font-weight="600">Reconsider or cut.</text>
  <text x="427" y="440" text-anchor="middle" fill="#94A3B8" font-size="9">Adds to noise, not signal.</text>

  <!-- YES to has-POV -->
  <line x1="630" y1="444" x2="630" y2="478" stroke="#475569" stroke-width="1.5"/>
  <polygon points="626,475 630,483 634,475" fill="#475569"/>
  <text x="648" y="466" text-anchor="start" fill="#475569" font-size="9">YES</text>
  <rect x="558" y="483" width="144" height="40" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="630" y="500" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="600">AI-assisted production</text>
  <text x="630" y="514" text-anchor="middle" fill="#475569" font-size="9">Human adds unique framing</text>

  <!-- RIGHT result -->
  <line x1="630" y1="523" x2="630" y2="549" stroke="#475569" stroke-width="1.5"/>
  <polygon points="626,546 630,554 634,546" fill="#475569"/>
  <rect x="558" y="554" width="144" height="30" rx="6" fill="#475569"/>
  <text x="630" y="567" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="600">Moderate traffic, lower cost</text>
  <text x="630" y="579" text-anchor="middle" fill="#CBD5E1" font-size="9">Use for volume cadence only</text>

  <!-- CENTER: Key principle -->
  <rect x="310" y="470" width="160" height="56" rx="6" fill="#0F172A" stroke="#DC2626" stroke-width="1.5"/>
  <text x="390" y="491" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="700">The Ratio Rule</text>
  <text x="390" y="506" text-anchor="middle" fill="#94A3B8" font-size="9">For every 3 synthesis pieces,</text>
  <text x="390" y="519" text-anchor="middle" fill="#DC2626" font-size="9" font-weight="600">publish 1 high-value original.</text>

  <!-- Connect center rule to branches -->
  <line x1="310" y1="498" x2="240" y2="498" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="470" y1="498" x2="556" y2="498" stroke="#475569" stroke-width="1" stroke-dasharray="3 2"/>

</svg>
