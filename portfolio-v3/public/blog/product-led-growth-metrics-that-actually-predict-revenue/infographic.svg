<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#FAFAF9;">

  <!-- Background -->
  <rect width="800" height="620" fill="#FAFAF9"/>

  <!-- Title block -->
  <rect x="0" y="0" width="800" height="70" fill="#0F172A"/>
  <text x="400" y="30" text-anchor="middle" fill="#F1F5F9" font-size="17" font-weight="700" letter-spacing="0.3">The PLG Measurement Stack</text>
  <text x="400" y="52" text-anchor="middle" fill="#94A3B8" font-size="12">What to track, when to track it, and what it predicts</text>

  <!-- Left column header: TIER -->
  <text x="32" y="100" fill="#64748B" font-size="10" font-weight="600" letter-spacing="1" text-anchor="start">TIER</text>
  <!-- Right column header: CONVERSION IMPACT -->
  <text x="768" y="100" fill="#64748B" font-size="10" font-weight="600" letter-spacing="1" text-anchor="end">CONVERSION LIFT</text>

  <!-- Vertical spine -->
  <line x1="400" y1="90" x2="400" y2="590" stroke="#E7E5E4" stroke-width="2"/>

  <!-- ===== TIER 1: SURFACE SIGNALS ===== -->
  <rect x="20" y="110" width="760" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="20" y="110" width="190" height="6" rx="3" fill="#94A3B8"/>
  <text x="400" y="108" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">TIER 1 — Surface Signals (Most tracked. Least predictive.)</text>

  <!-- Metric: Signup volume -->
  <rect x="30" y="125" width="336" height="52" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="48" y="147" fill="#0F172A" font-size="13" font-weight="600">Free Signup Volume</text>
  <text x="48" y="163" fill="#64748B" font-size="11">Tracked by 91% of PLG teams</text>
  <rect x="435" y="125" width="335" height="52" rx="6" fill="#F8FAFC" stroke="#E7E5E4" stroke-width="1"/>
  <text x="603" y="147" text-anchor="middle" fill="#94A3B8" font-size="13" font-weight="600">+0–5%</text>
  <text x="603" y="163" text-anchor="middle" fill="#94A3B8" font-size="11">No direct correlation to paid conversion</text>

  <!-- Metric: MQL -->
  <rect x="30" y="185" width="336" height="52" rx="6" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="48" y="207" fill="#0F172A" font-size="13" font-weight="600">Marketing Qualified Leads (MQLs)</text>
  <text x="48" y="223" fill="#64748B" font-size="11">5–10% average conversion to paid</text>
  <rect x="435" y="185" width="335" height="52" rx="6" fill="#F8FAFC" stroke="#E7E5E4" stroke-width="1"/>
  <text x="603" y="207" text-anchor="middle" fill="#94A3B8" font-size="13" font-weight="600">+5–10%</text>
  <text x="603" y="223" text-anchor="middle" fill="#94A3B8" font-size="11">Blunt. Predicts intent, not value realization.</text>

  <!-- ===== TIER 2: DEPTH SIGNALS ===== -->
  <rect x="20" y="252" width="760" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="20" y="252" width="380" height="6" rx="3" fill="#2563EB"/>
  <text x="400" y="250" text-anchor="middle" fill="#2563EB" font-size="11" font-weight="600">TIER 2 — Depth Signals (Tracked by minority. Strong predictors.)</text>

  <!-- Metric: Activation rate -->
  <rect x="30" y="267" width="336" height="52" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="48" y="289" fill="#1E40AF" font-size="13" font-weight="600">Activation Rate</text>
  <text x="48" y="305" fill="#1E40AF" font-size="11">Tracked by only 34% of PLG teams</text>
  <rect x="435" y="267" width="335" height="52" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="603" y="289" text-anchor="middle" fill="#1D4ED8" font-size="13" font-weight="700">+40–60%</text>
  <text x="603" y="305" text-anchor="middle" fill="#1E40AF" font-size="11">Top PLG predictor after TTV</text>

  <!-- Metric: NRR -->
  <rect x="30" y="327" width="336" height="52" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="48" y="349" fill="#1E40AF" font-size="13" font-weight="600">Net Revenue Retention (NRR)</text>
  <text x="48" y="365" fill="#1E40AF" font-size="11">Tracked by 68% — but often acted on too late</text>
  <rect x="435" y="327" width="335" height="52" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="603" y="349" text-anchor="middle" fill="#1D4ED8" font-size="13" font-weight="700">+15–20%</text>
  <text x="603" y="365" text-anchor="middle" fill="#1E40AF" font-size="11">Expansion revenue indicator</text>

  <!-- ===== TIER 3: REVENUE SIGNALS ===== -->
  <rect x="20" y="396" width="760" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="20" y="396" width="570" height="6" rx="3" fill="#DC2626"/>
  <text x="400" y="394" text-anchor="middle" fill="#DC2626" font-size="11" font-weight="700">TIER 3 — Revenue Signals (Rarely tracked. Strongest predictors.)</text>

  <!-- Metric: PQLs -->
  <rect x="30" y="411" width="336" height="52" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="48" y="433" fill="#991B1B" font-size="13" font-weight="700">Product Qualified Leads (PQLs)</text>
  <text x="48" y="449" fill="#B91C1C" font-size="11">Tracked by only 24% of PLG teams</text>
  <rect x="435" y="411" width="335" height="52" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="603" y="433" text-anchor="middle" fill="#DC2626" font-size="15" font-weight="800">25–30%</text>
  <text x="603" y="449" text-anchor="middle" fill="#991B1B" font-size="11">3x higher than MQL conversion</text>

  <!-- Metric: TTV -->
  <rect x="30" y="471" width="336" height="52" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="48" y="493" fill="#991B1B" font-size="13" font-weight="700">Time-to-Value (TTV)</text>
  <text x="48" y="509" fill="#B91C1C" font-size="11">Tracked by only 17% of PLG teams</text>
  <rect x="435" y="471" width="335" height="52" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="603" y="493" text-anchor="middle" fill="#DC2626" font-size="15" font-weight="800">Highest</text>
  <text x="603" y="509" text-anchor="middle" fill="#991B1B" font-size="11">98% churn when value milestone never hit</text>

  <!-- Bottom callout box -->
  <rect x="20" y="538" width="760" height="62" rx="8" fill="#0F172A"/>
  <text x="400" y="561" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">The Measurement Inversion</text>
  <text x="400" y="580" text-anchor="middle" fill="#94A3B8" font-size="11">Teams tracking PQLs and TTV are 61% more likely to achieve fast growth (OpenView)</text>
  <text x="400" y="595" text-anchor="middle" fill="#94A3B8" font-size="11">yet these are the two least-tracked metrics in the average PLG stack</text>

  <!-- Left labels -->
  <text x="32" y="157" fill="#94A3B8" font-size="10" font-weight="600">LOW</text>
  <text x="32" y="310" fill="#2563EB" font-size="10" font-weight="600">MID</text>
  <text x="32" y="463" fill="#DC2626" font-size="10" font-weight="700">HIGH</text>

</svg>
