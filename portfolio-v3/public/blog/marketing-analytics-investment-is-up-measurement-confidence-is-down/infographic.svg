<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" style="background:#FAFAF9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;">

  <!-- Background -->
  <rect width="800" height="580" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">The Measurement Maturity Stack</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#475569">Only 39% of marketing teams reach Level 3. Here's what separates them.</text>

  <!-- Connector arrows between levels -->
  <!-- Arrow 1→2 -->
  <line x1="400" y1="193" x2="400" y2="225" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Arrow 2→3 -->
  <line x1="400" y1="355" x2="400" y2="387" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- LEVEL 1 -->
  <rect x="60" y="90" width="680" height="100" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <!-- Level badge -->
  <rect x="60" y="90" width="7" height="100" rx="4" fill="#94A3B8"/>
  <text x="92" y="120" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="start">LEVEL 1 — 61% OF TEAMS</text>
  <text x="92" y="143" font-size="15" font-weight="700" fill="#0F172A">Single-Method Measurement</text>
  <text x="92" y="164" font-size="12" fill="#475569">Platform-reported attribution only. Fast to report, easy to present. Systematically over-credits</text>
  <text x="92" y="181" font-size="12" fill="#475569">the last touchpoint and the loudest channel. Trusted by fewer than 1 in 5 who use it.</text>

  <!-- LEVEL 2 -->
  <rect x="60" y="228" width="680" height="124" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="60" y="228" width="7" height="124" rx="4" fill="#475569"/>
  <text x="92" y="258" font-size="11" font-weight="600" fill="#475569" text-anchor="start">LEVEL 2 — PARTIAL STACK</text>
  <text x="92" y="281" font-size="15" font-weight="700" fill="#0F172A">Partial Integration (2 of 3 Methods)</text>

  <!-- Two columns at level 2 -->
  <!-- MMM box -->
  <rect x="92" y="295" width="180" height="44" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="102" y="315" font-size="12" font-weight="600" fill="#0F172A">Marketing Mix Modeling</text>
  <text x="102" y="331" font-size="11" fill="#475569">Portfolio view, offline-inclusive</text>

  <!-- Incrementality box -->
  <rect x="288" y="295" width="200" height="44" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="298" y="315" font-size="12" font-weight="600" fill="#0F172A">Incrementality Testing</text>
  <text x="298" y="331" font-size="11" fill="#475569">Causal lift, holds channels honest</text>

  <!-- Note -->
  <text x="510" y="315" font-size="12" fill="#94A3B8">Better, but without the third</text>
  <text x="510" y="332" font-size="12" fill="#94A3B8">leg, still produces gaps.</text>

  <!-- LEVEL 3 -->
  <rect x="60" y="390" width="680" height="148" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="60" y="390" width="7" height="148" rx="4" fill="#DC2626"/>
  <text x="92" y="420" font-size="11" font-weight="600" fill="#DC2626" text-anchor="start">LEVEL 3 — 39% OF TEAMS</text>
  <text x="92" y="443" font-size="15" font-weight="700" fill="#0F172A">Triangulated Measurement Stack</text>

  <!-- Three boxes in row -->
  <!-- MMM -->
  <rect x="92" y="458" width="190" height="64" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="102" y="477" font-size="12" font-weight="700" fill="#DC2626">MMM</text>
  <text x="102" y="494" font-size="11" fill="#475569">Strategic allocation.</text>
  <text x="102" y="509" font-size="11" fill="#475569">Slow but comprehensive.</text>

  <!-- Plus sign -->
  <text x="302" y="498" font-size="22" font-weight="300" fill="#94A3B8" text-anchor="middle">+</text>

  <!-- Incrementality -->
  <rect x="318" y="458" width="190" height="64" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="328" y="477" font-size="12" font-weight="700" fill="#DC2626">Incrementality</text>
  <text x="328" y="494" font-size="11" fill="#475569">Causal ground truth.</text>
  <text x="328" y="509" font-size="11" fill="#475569">Validates MMM outputs.</text>

  <!-- Plus sign -->
  <text x="528" y="498" font-size="22" font-weight="300" fill="#94A3B8" text-anchor="middle">+</text>

  <!-- Attribution -->
  <rect x="544" y="458" width="190" height="64" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="554" y="477" font-size="12" font-weight="700" fill="#DC2626">Attribution</text>
  <text x="554" y="494" font-size="11" fill="#475569">Tactical optimization.</text>
  <text x="554" y="509" font-size="11" fill="#475569">Fast signal, limited scope.</text>

  <!-- Source line -->
  <text x="400" y="562" text-anchor="middle" font-size="10" fill="#94A3B8">Sources: IAB State of Data 2026; eMarketer/TransUnion 2025; eMarketer/Snap 2024</text>

</svg>
