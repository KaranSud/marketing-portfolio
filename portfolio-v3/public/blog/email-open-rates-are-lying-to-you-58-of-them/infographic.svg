<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background:#FAFAF9; border-radius:8px;">

  <!-- Background -->
  <rect width="800" height="560" fill="#FAFAF9" rx="8"/>

  <!-- Title block -->
  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">5 Email Decisions Corrupted by Fake Open Rate Data</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#475569">Each decision breaks differently — here's the correct metric to replace it with</text>

  <!-- Divider -->
  <line x1="40" y1="72" x2="760" y2="72" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Column headers -->
  <rect x="40" y="82" width="230" height="32" rx="4" fill="#0F172A"/>
  <text x="155" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="#FAFAF9">Decision</text>

  <rect x="282" y="82" width="220" height="32" rx="4" fill="#DC2626"/>
  <text x="392" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">What Goes Wrong (Using Open Rate)</text>

  <rect x="514" y="82" width="246" height="32" rx="4" fill="#475569"/>
  <text x="637" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="#FAFAF9">Use This Metric Instead</text>

  <!-- Row 1: A/B Testing -->
  <rect x="40" y="126" width="720" height="68" rx="4" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <rect x="40" y="126" width="4" height="68" rx="2" fill="#DC2626"/>
  <text x="70" y="150" font-size="13" font-weight="700" fill="#0F172A">A/B Testing</text>
  <text x="70" y="168" font-size="12" fill="#475569">Subject line winners chosen</text>
  <text x="70" y="184" font-size="12" fill="#475569">based on machine behavior</text>

  <line x1="280" y1="126" x2="280" y2="194" stroke="#E2E8F0" stroke-width="1"/>
  <text x="292" y="147" font-size="12" fill="#0F172A">Apple's servers fire the winning</text>
  <text x="292" y="163" font-size="12" fill="#0F172A">pixel before anyone reads it.</text>
  <text x="292" y="179" font-size="12" fill="#DC2626" font-weight="600">Wrong winner, every time.</text>

  <line x1="512" y1="126" x2="512" y2="194" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="524" y="138" width="220" height="42" rx="4" fill="#F0FDF4"/>
  <text x="634" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Click Rate</text>
  <text x="634" y="172" text-anchor="middle" font-size="11" fill="#475569">Determines winner by actual human click</text>

  <!-- Row 2: Re-engagement -->
  <rect x="40" y="204" width="720" height="68" rx="4" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <rect x="40" y="204" width="4" height="68" rx="2" fill="#DC2626"/>
  <text x="70" y="228" font-size="13" font-weight="700" fill="#0F172A">Re-engagement Sequences</text>
  <text x="70" y="246" font-size="12" fill="#475569">Targeting subscribers who</text>
  <text x="70" y="262" font-size="12" fill="#475569">"haven't opened in 90 days"</text>

  <line x1="280" y1="204" x2="280" y2="272" stroke="#E2E8F0" stroke-width="1"/>
  <text x="292" y="225" font-size="12" fill="#0F172A">MPP saves some contacts</text>
  <text x="292" y="241" font-size="12" fill="#0F172A">from suppression undeservedly.</text>
  <text x="292" y="257" font-size="12" fill="#DC2626" font-weight="600">Wrong people get the sequence.</text>

  <line x1="512" y1="204" x2="512" y2="272" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="524" y="216" width="220" height="42" rx="4" fill="#F0FDF4"/>
  <text x="634" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Click Silence (120 days)</text>
  <text x="634" y="250" text-anchor="middle" font-size="11" fill="#475569">MPP can't fake a click; silence is real</text>

  <!-- Row 3: Suppression -->
  <rect x="40" y="282" width="720" height="68" rx="4" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <rect x="40" y="282" width="4" height="68" rx="2" fill="#DC2626"/>
  <text x="70" y="306" font-size="13" font-weight="700" fill="#0F172A">Suppression Lists</text>
  <text x="70" y="324" font-size="12" fill="#475569">Deleting "inactive" subscribers</text>
  <text x="70" y="340" font-size="12" fill="#475569">after 180 days of no opens</text>

  <line x1="280" y1="282" x2="280" y2="350" stroke="#E2E8F0" stroke-width="1"/>
  <text x="292" y="303" font-size="12" fill="#0F172A">Real buyers deleted because they</text>
  <text x="292" y="319" font-size="12" fill="#0F172A">use a non-Apple mail client.</text>
  <text x="292" y="335" font-size="12" fill="#DC2626" font-weight="600">Revenue walks out the door.</text>

  <line x1="512" y1="282" x2="512" y2="350" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="524" y="294" width="220" height="42" rx="4" fill="#F0FDF4"/>
  <text x="634" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Click + Purchase History</text>
  <text x="634" y="328" text-anchor="middle" font-size="11" fill="#475569">180-day click + no purchase = suppress</text>

  <!-- Row 4: Send-time optimization -->
  <rect x="40" y="360" width="720" height="68" rx="4" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <rect x="40" y="360" width="4" height="68" rx="2" fill="#475569"/>
  <text x="70" y="384" font-size="13" font-weight="700" fill="#0F172A">Send-Time Optimization</text>
  <text x="70" y="402" font-size="12" fill="#475569">Timing emails for when</text>
  <text x="70" y="418" font-size="12" fill="#475569">subscribers "open" most</text>

  <line x1="280" y1="360" x2="280" y2="428" stroke="#E2E8F0" stroke-width="1"/>
  <text x="292" y="381" font-size="12" fill="#0F172A">MPP fires at delivery, not reading.</text>
  <text x="292" y="397" font-size="12" fill="#0F172A">STO optimizes for delivery windows,</text>
  <text x="292" y="413" font-size="12" fill="#DC2626" font-weight="600">not actual reading behavior.</text>

  <line x1="512" y1="360" x2="512" y2="428" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="524" y="372" width="220" height="42" rx="4" fill="#F0FDF4"/>
  <text x="634" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Click-Time Patterns</text>
  <text x="634" y="406" text-anchor="middle" font-size="11" fill="#475569">When subscribers click = when they read</text>

  <!-- Row 5: Segmentation -->
  <rect x="40" y="438" width="720" height="68" rx="4" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <rect x="40" y="438" width="4" height="68" rx="2" fill="#475569"/>
  <text x="70" y="462" font-size="13" font-weight="700" fill="#0F172A">Engagement Segmentation</text>
  <text x="70" y="480" font-size="12" fill="#475569">Defining "highly engaged" list</text>
  <text x="70" y="496" font-size="12" fill="#475569">by top open-rate decile</text>

  <line x1="280" y1="438" x2="280" y2="506" stroke="#E2E8F0" stroke-width="1"/>
  <text x="292" y="459" font-size="12" fill="#0F172A">Your "most engaged" segment</text>
  <text x="292" y="475" font-size="12" fill="#0F172A">may be Apple's busiest servers,</text>
  <text x="292" y="491" font-size="12" fill="#DC2626" font-weight="600">not your best customers.</text>

  <line x1="512" y1="438" x2="512" y2="506" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="524" y="450" width="220" height="42" rx="4" fill="#F0FDF4"/>
  <text x="634" y="467" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Click + Conversion Score</text>
  <text x="634" y="484" text-anchor="middle" font-size="11" fill="#475569">Click recency + purchase LTV combined</text>

  <!-- Footer -->
  <line x1="40" y1="518" x2="760" y2="518" stroke="#E2E8F0" stroke-width="1"/>
  <text x="400" y="538" text-anchor="middle" font-size="11" fill="#94A3B8">Source: Litmus Email Client Market Share (2025); Validity State of Email 2025; McKinsey Next in Personalization 2021</text>
  <text x="400" y="552" text-anchor="middle" font-size="11" fill="#94A3B8">karansud.com — Email Marketing and Automation</text>

</svg>
