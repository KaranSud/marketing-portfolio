<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background: #FAFAF9;">
  <!-- Background -->
  <rect width="800" height="900" fill="#FAFAF9" rx="12"/>

  <!-- Title Block -->
  <rect x="40" y="24" width="720" height="64" rx="8" fill="#0F172A"/>
  <text x="400" y="50" text-anchor="middle" fill="#F1F5F9" font-size="15" font-weight="700">Do You Have an ICP Precision Problem?</text>
  <text x="400" y="72" text-anchor="middle" fill="#94A3B8" font-size="12">A 5-question diagnostic for SaaS CAC payback deterioration</text>

  <!-- Q1 Box -->
  <rect x="250" y="118" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="400" y="140" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">Q1</text>
  <text x="400" y="158" text-anchor="middle" fill="#0F172A" font-size="12">Has your blended CAC risen &gt; 15%</text>
  <text x="400" y="173" text-anchor="middle" fill="#0F172A" font-size="12">in the last 12 months?</text>

  <!-- Q1 arrows -->
  <line x1="310" y1="174" x2="190" y2="226" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="174" x2="610" y2="226" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="205" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="600">YES</text>
  <text x="570" y="205" text-anchor="middle" fill="#64748B" font-size="11" font-weight="600">NO</text>

  <!-- Q2 box (YES path) -->
  <rect x="80" y="226" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="200" y="248" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">Q2</text>
  <text x="200" y="264" text-anchor="middle" fill="#0F172A" font-size="12">Is your blended CAC higher than</text>
  <text x="200" y="279" text-anchor="middle" fill="#0F172A" font-size="12">your best customer cohort's CAC?</text>

  <!-- OK node (NO path) -->
  <rect x="490" y="226" width="240" height="56" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="610" y="248" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">Likely not an ICP issue</text>
  <text x="610" y="264" text-anchor="middle" fill="#166534" font-size="12">Check channel mix and</text>
  <text x="610" y="279" text-anchor="middle" fill="#166534" font-size="12">bid strategy first</text>

  <!-- Q2 arrows -->
  <line x1="150" y1="282" x2="130" y2="330" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="282" x2="270" y2="330" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="118" y="316" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="600">YES</text>
  <text x="282" y="316" text-anchor="middle" fill="#64748B" font-size="11" font-weight="600">NO</text>

  <!-- Q3 box (YES from Q2) -->
  <rect x="40" y="330" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="140" y="352" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">Q3</text>
  <text x="140" y="368" text-anchor="middle" fill="#0F172A" font-size="12">Do deals in your current</text>
  <text x="140" y="383" text-anchor="middle" fill="#0F172A" font-size="12">pipeline involve 7+ stakeholders?</text>

  <!-- Channel-mix node (NO from Q2) -->
  <rect x="205" y="330" width="200" height="56" rx="8" fill="#FEF9C3" stroke="#FDE047" stroke-width="1.5"/>
  <text x="305" y="356" text-anchor="middle" fill="#713F12" font-size="12" font-weight="600">Partial ICP drift</text>
  <text x="305" y="372" text-anchor="middle" fill="#713F12" font-size="12">Segment CAC by customer</text>
  <text x="305" y="386" text-anchor="middle" fill="#713F12" font-size="12">type to find the gap</text>

  <!-- Q3 arrows -->
  <line x1="100" y1="386" x2="90" y2="434" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="386" x2="190" y2="434" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="78" y="422" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="600">YES</text>
  <text x="202" y="422" text-anchor="middle" fill="#64748B" font-size="11" font-weight="600">NO</text>

  <!-- Q4 box (YES from Q3) -->
  <rect x="20" y="434" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="120" y="456" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">Q4</text>
  <text x="120" y="472" text-anchor="middle" fill="#0F172A" font-size="12">Did those accounts come from</text>
  <text x="120" y="487" text-anchor="middle" fill="#0F172A" font-size="12">broad demand-gen campaigns?</text>

  <!-- Sales-motion node (NO from Q3) -->
  <rect x="170" y="434" width="200" height="56" rx="8" fill="#FEF9C3" stroke="#FDE047" stroke-width="1.5"/>
  <text x="270" y="460" text-anchor="middle" fill="#713F12" font-size="12" font-weight="600">Sales motion issue</text>
  <text x="270" y="476" text-anchor="middle" fill="#713F12" font-size="12">Your ICP is right but</text>
  <text x="270" y="490" text-anchor="middle" fill="#713F12" font-size="12">deal structure needs work</text>

  <!-- Q4 arrows -->
  <line x1="80" y1="490" x2="80" y2="538" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="490" x2="160" y2="538" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="66" y="524" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="600">YES</text>
  <text x="174" y="524" text-anchor="middle" fill="#64748B" font-size="11" font-weight="600">NO</text>

  <!-- ICP Drift Alert (YES from Q4) -->
  <rect x="20" y="538" width="200" height="56" rx="8" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="120" y="562" text-anchor="middle" fill="#991B1B" font-size="12" font-weight="700">ICP drift confirmed</text>
  <text x="120" y="578" text-anchor="middle" fill="#991B1B" font-size="12">Run the 24-month ICP audit</text>
  <text x="120" y="591" text-anchor="middle" fill="#991B1B" font-size="11">immediately</text>

  <!-- Targeting issue node (NO from Q4) -->
  <rect x="120" y="538" width="200" height="56" rx="8" fill="#FEF9C3" stroke="#FDE047" stroke-width="1.5"/>
  <text x="220" y="560" text-anchor="middle" fill="#713F12" font-size="12" font-weight="600">Channel targeting drift</text>
  <text x="220" y="576" text-anchor="middle" fill="#713F12" font-size="12">Your ICP is defined. Your</text>
  <text x="220" y="590" text-anchor="middle" fill="#713F12" font-size="11">targeting isn't respecting it.</text>

  <!-- Separator -->
  <line x1="40" y1="634" x2="760" y2="634" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Fix Framework Box -->
  <rect x="40" y="648" width="720" height="210" rx="8" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="400" y="672" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="700">The Three-Lever Fix</text>
  <text x="400" y="690" text-anchor="middle" fill="#64748B" font-size="11">For SaaS companies with confirmed ICP precision problems</text>

  <!-- Lever 1 -->
  <rect x="60" y="700" width="200" height="130" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="160" y="722" text-anchor="middle" fill="#1D4ED8" font-size="22" font-weight="800">01</text>
  <text x="160" y="744" text-anchor="middle" fill="#1E3A5F" font-size="12" font-weight="700">Segment your CAC</text>
  <text x="160" y="760" text-anchor="middle" fill="#374151" font-size="11">Pull 24 months of closed-won</text>
  <text x="160" y="775" text-anchor="middle" fill="#374151" font-size="11">deals. Calculate payback per</text>
  <text x="160" y="790" text-anchor="middle" fill="#374151" font-size="11">customer cohort, not blended.</text>
  <text x="160" y="806" text-anchor="middle" fill="#374151" font-size="11">Find your efficient cohort.</text>
  <text x="160" y="821" text-anchor="middle" fill="#1D4ED8" font-size="10" font-weight="600">Timeline: 1 week</text>

  <!-- Lever 2 -->
  <rect x="300" y="700" width="200" height="130" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="400" y="722" text-anchor="middle" fill="#16A34A" font-size="22" font-weight="800">02</text>
  <text x="400" y="744" text-anchor="middle" fill="#14532D" font-size="12" font-weight="700">Add decision-structure</text>
  <text x="400" y="760" text-anchor="middle" fill="#14532D" font-size="12" font-weight="700">to your qualification</text>
  <text x="400" y="778" text-anchor="middle" fill="#374151" font-size="11">Score prospects by committee</text>
  <text x="400" y="793" text-anchor="middle" fill="#374151" font-size="11">size and budget authority. A</text>
  <text x="400" y="808" text-anchor="middle" fill="#374151" font-size="11">16-person committee is a</text>
  <text x="400" y="821" text-anchor="middle" fill="#16A34A" font-size="10" font-weight="600">Timeline: 2 weeks</text>

  <!-- Lever 3 -->
  <rect x="540" y="700" width="200" height="130" rx="6" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
  <text x="640" y="722" text-anchor="middle" fill="#EA580C" font-size="22" font-weight="800">03</text>
  <text x="640" y="744" text-anchor="middle" fill="#7C2D12" font-size="12" font-weight="700">Shift budget toward</text>
  <text x="640" y="760" text-anchor="middle" fill="#7C2D12" font-size="12" font-weight="700">expansion ARR</text>
  <text x="640" y="778" text-anchor="middle" fill="#374151" font-size="11">$1.00 to acquire $1 expansion</text>
  <text x="640" y="793" text-anchor="middle" fill="#374151" font-size="11">vs $2.00 for new logo. If NRR</text>
  <text x="640" y="808" text-anchor="middle" fill="#374151" font-size="11">is above 100%, expansion</text>
  <text x="640" y="821" text-anchor="middle" fill="#EA580C" font-size="10" font-weight="600">Timeline: Next quarter</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="400" y="882" text-anchor="middle" fill="#94A3B8" font-size="10">Data: Gartner (2025), McKinsey (2025), Benchmarkit/Pavilion (2025) | karan-sud-portfolio.vercel.app</text>
</svg>
