  <text x="656" y="253" text-anchor="middle" fill="#10B981" font-size="12" font-weight="700">Avg Cost Per SQL</text>
  <text x="656" y="273" text-anchor="middle" fill="#10B981" font-size="20" font-weight="800">$1,300</text>
  <text x="656" y="291" text-anchor="middle" fill="#94A3B8" font-size="10">Pipeline quality climbs fast</text>

  <!-- Arrow -->
  <path d="M732,200 L754,200" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

