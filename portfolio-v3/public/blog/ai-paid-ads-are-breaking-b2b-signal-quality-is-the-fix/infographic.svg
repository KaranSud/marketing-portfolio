<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" style="background:#FAFAF9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;">
  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="700">B2B Signal Architecture for AI Paid Ads</text>
  <text x="450" y="64" text-anchor="middle" fill="#64748B" font-size="12">The five-stage framework for teaching AI bidding platforms to find your actual buyers</text>

  <!-- Divider -->
  <line x1="60" y1="76" x2="840" y2="76" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Stage boxes -->
