  <rect x="408" y="90" width="148" height="32" rx="8" fill="#16A34A"/>
  <rect x="408" y="110" width="148" height="12" rx="0" fill="#16A34A"/>
  <text x="482" y="111" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">STAGE 3</text>
  <text x="482" y="141" text-anchor="middle" fill="#166534" font-size="12" font-weight="700">Lead Scoring Upload</text>

  <text x="482" y="168" text-anchor="middle" fill="#166534" font-size="11">Add signals:</text>
  <text x="482" y="186" text-anchor="middle" fill="#475569" font-size="11">• MQL score via GCLID</text>
  <text x="482" y="202" text-anchor="middle" fill="#475569" font-size="11">• Lead grade (A/B/C)</text>
  <text x="482" y="218" text-anchor="middle" fill="#475569" font-size="11">• Disqualified = 0 value</text>

  <line x1="428" y1="234" x2="536" y2="234" stroke="#E7E5E4" stroke-width="1"/>
  <text x="482" y="253" text-anchor="middle" fill="#16A34A" font-size="12" font-weight="700">Avg Cost Per SQL</text>
  <text x="482" y="273" text-anchor="middle" fill="#16A34A" font-size="20" font-weight="800">$1,900</text>
  <text x="482" y="291" text-anchor="middle" fill="#94A3B8" font-size="10">AI stops chasing junk leads</text>

  <!-- Arrow -->
  <path d="M558,200 L580,200" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

