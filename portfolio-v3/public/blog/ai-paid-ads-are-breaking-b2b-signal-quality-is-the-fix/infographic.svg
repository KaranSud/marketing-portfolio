  <rect x="60" y="90" width="148" height="32" rx="8" fill="#DC2626"/>
  <rect x="60" y="110" width="148" height="12" rx="0" fill="#DC2626"/>
  <text x="134" y="111" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">STAGE 1</text>
  <text x="134" y="141" text-anchor="middle" fill="#DC2626" font-size="13" font-weight="700">Form Fills Only</text>

  <text x="134" y="168" text-anchor="middle" fill="#7F1D1D" font-size="11">Signals taught:</text>
  <text x="134" y="186" text-anchor="middle" fill="#475569" font-size="11">• Web form submission</text>
  <text x="134" y="202" text-anchor="middle" fill="#475569" font-size="11">• Contact page visit</text>
  <text x="134" y="218" text-anchor="middle" fill="#475569" font-size="11">• Demo request click</text>

  <line x1="80" y1="234" x2="188" y2="234" stroke="#E7E5E4" stroke-width="1"/>
  <text x="134" y="253" text-anchor="middle" fill="#DC2626" font-size="12" font-weight="700">Avg Cost Per SQL</text>
  <text x="134" y="273" text-anchor="middle" fill="#DC2626" font-size="20" font-weight="800">$3,200</text>
  <text x="134" y="291" text-anchor="middle" fill="#94A3B8" font-size="10">AI finds anyone who clicks forms</text>

  <!-- Arrow -->
  <path d="M210,200 L232,200" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

