  <text x="656" y="141" text-anchor="middle" fill="#065F46" font-size="12" font-weight="700">CRM Integration</text>

  <text x="656" y="168" text-anchor="middle" fill="#065F46" font-size="11">Add signals:</text>
  <text x="656" y="186" text-anchor="middle" fill="#475569" font-size="11">• Opportunity created</text>
  <text x="656" y="202" text-anchor="middle" fill="#475569" font-size="11">• SQL status confirmed</text>
  <text x="656" y="218" text-anchor="middle" fill="#475569" font-size="11">• Deal stage updates</text>

