  <text x="308" y="141" text-anchor="middle" fill="#92400E" font-size="12" font-weight="700">Engagement Signals</text>

  <text x="308" y="168" text-anchor="middle" fill="#92400E" font-size="11">Add signals:</text>
  <text x="308" y="186" text-anchor="middle" fill="#475569" font-size="11">• Time on site (&gt;3 min)</text>
  <text x="308" y="202" text-anchor="middle" fill="#475569" font-size="11">• Pricing page visits</text>
  <text x="308" y="218" text-anchor="middle" fill="#475569" font-size="11">• Multi-session return</text>

  <line x1="254" y1="234" x2="362" y2="234" stroke="#E7E5E4" stroke-width="1"/>
  <text x="308" y="253" text-anchor="middle" fill="#D97706" font-size="12" font-weight="700">Avg Cost Per SQL</text>
  <text x="308" y="273" text-anchor="middle" fill="#D97706" font-size="20" font-weight="800">$2,600</text>
  <text x="308" y="291" text-anchor="middle" fill="#94A3B8" font-size="10">Better intent proxies emerge</text>

  <!-- Arrow -->
  <path d="M384,200 L406,200" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

