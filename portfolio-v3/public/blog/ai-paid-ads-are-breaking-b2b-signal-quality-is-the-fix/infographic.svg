  <rect x="756" y="110" width="148" height="12" rx="0" fill="#059669"/>
  <text x="830" y="111" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">STAGE 5</text>
  <text x="830" y="141" text-anchor="middle" fill="#064E3B" font-size="12" font-weight="700">Revenue Events</text>

  <text x="830" y="168" text-anchor="middle" fill="#064E3B" font-size="11">Add signals:</text>
  <text x="830" y="186" text-anchor="middle" fill="#475569" font-size="11">• Closed-won (full value)</text>
  <text x="830" y="202" text-anchor="middle" fill="#475569" font-size="11">• ARR value via GCLID</text>
  <text x="830" y="218" text-anchor="middle" fill="#475569" font-size="11">• LTV-weighted bidding</text>

  <line x1="776" y1="234" x2="884" y2="234" stroke="#E7E5E4" stroke-width="1"/>
  <text x="830" y="253" text-anchor="middle" fill="#059669" font-size="12" font-weight="700">Avg Cost Per SQL</text>
  <text x="830" y="273" text-anchor="middle" fill="#059669" font-size="20" font-weight="800">$820</text>
  <text x="830" y="291" text-anchor="middle" fill="#94A3B8" font-size="10">AI optimizes for actual revenue</text>

  <!-- Arrow marker def -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94A3B8"/>
