  <text x="205" y="410" text-anchor="middle" fill="#475569" font-size="11">Enhanced conversions enabled</text>
  <text x="205" y="426" text-anchor="middle" fill="#475569" font-size="11">GCLID capture in CRM fields</text>
  <text x="205" y="442" text-anchor="middle" fill="#475569" font-size="11">Offline conversion import &lt;24h</text>

  <rect x="345" y="370" width="250" height="80" rx="6" fill="#fff" stroke="#E2E8F0" stroke-width="1"/>
  <text x="470" y="392" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">Data Requirements</text>
  <text x="470" y="410" text-anchor="middle" fill="#475569" font-size="11">30+ conversions/month minimum</text>
  <text x="470" y="426" text-anchor="middle" fill="#475569" font-size="11">Conversion values, not just events</text>
  <text x="470" y="442" text-anchor="middle" fill="#475569" font-size="11">Negative signal data (disqualified)</text>

  <rect x="610" y="370" width="250" height="80" rx="6" fill="#fff" stroke="#E2E8F0" stroke-width="1"/>
  <text x="735" y="392" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">Bidding Strategy</text>
  <text x="735" y="410" text-anchor="middle" fill="#475569" font-size="11">Target CPA or value-based bidding</text>
  <text x="735" y="426" text-anchor="middle" fill="#475569" font-size="11">Audience signals from CRM list</text>
  <text x="735" y="442" text-anchor="middle" fill="#475569" font-size="11">4–6 week learning period protected</text>

  <!-- Key insight bar -->
  <rect x="60" y="490" width="840" height="60" rx="8" fill="#0F172A"/>
  <text x="450" y="517" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">The Core Insight</text>
  <text x="450" y="537" text-anchor="middle" fill="#94A3B8" font-size="12">AI bidding platforms optimize for exactly what you show them — signal quality is the only lever B2B marketers control.</text>

  <!-- Footer -->
  <text x="450" y="580" text-anchor="middle" fill="#94A3B8" font-size="10">AI Paid Ads Optimization: B2B Signal Architecture Framework · karan-sud-portfolio.vercel.app</text>

  <!-- Progress arrow at bottom of stages -->
  <path d="M60,325 C130,315 780,315 840,325" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="450" y="320" text-anchor="middle" fill="#94A3B8" font-size="10">Signal Maturity Progression →</text>
