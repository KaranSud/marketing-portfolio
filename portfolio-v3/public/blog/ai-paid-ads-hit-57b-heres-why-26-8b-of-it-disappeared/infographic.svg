<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#FAFAF9;">

  <!-- Background -->
  <rect width="800" height="560" fill="#FAFAF9" rx="0"/>

  <!-- Title area -->
  <rect x="0" y="0" width="800" height="72" fill="#0F172A" rx="0"/>
  <text x="400" y="30" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">Signal Quality Audit for AI-Optimized Paid Ads</text>
  <text x="400" y="52" text-anchor="middle" fill="#94A3B8" font-size="12">Three questions to run before assuming your AI is optimizing correctly</text>

  <!-- STEP 1 -->
  <rect x="32" y="96" width="228" height="192" rx="10" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="32" y="96" width="228" height="4" rx="2" fill="#DC2626"/>
  <text x="48" y="124" fill="#DC2626" font-size="10" font-weight="700" letter-spacing="1">STEP 1</text>
  <text x="48" y="144" fill="#0F172A" font-size="13" font-weight="700">Map Conversion Events</text>
  <text x="48" y="160" fill="#0F172A" font-size="13" font-weight="700">to Revenue</text>

  <line x1="48" y1="172" x2="244" y2="172" stroke="#E2E8F0" stroke-width="1"/>

  <text x="48" y="191" fill="#475569" font-size="11">Pull last 90 days of</text>
  <text x="48" y="206" fill="#475569" font-size="11">platform-attributed conversions.</text>
  <text x="48" y="226" fill="#475569" font-size="11">Match each to a CRM record.</text>
  <text x="48" y="246" fill="#475569" font-size="11">Calculate: what % closed?</text>
  <text x="48" y="270" fill="#0F172A" font-size="11" font-weight="600">Flag: close rate below 5%</text>
  <text x="48" y="284" fill="#DC2626" font-size="11" font-weight="600">means your signal is broken.</text>

  <!-- STEP 2 -->
  <rect x="286" y="96" width="228" height="192" rx="10" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="286" y="96" width="228" height="4" rx="2" fill="#DC2626"/>
  <text x="302" y="124" fill="#DC2626" font-size="10" font-weight="700" letter-spacing="1">STEP 2</text>
  <text x="302" y="144" fill="#0F172A" font-size="13" font-weight="700">Measure Signal Loss</text>

  <line x1="302" y1="156" x2="498" y2="156" stroke="#E2E8F0" stroke-width="1"/>

  <text x="302" y="175" fill="#475569" font-size="11">Compare browser pixel fires</text>
  <text x="302" y="190" fill="#475569" font-size="11">to server-side event count</text>
  <text x="302" y="205" fill="#475569" font-size="11">for the same conversion.</text>
  <text x="302" y="225" fill="#475569" font-size="11">Industry avg: 20-40% loss</text>
  <text x="302" y="240" fill="#475569" font-size="11">from browser restrictions alone.</text>
  <text x="302" y="265" fill="#0F172A" font-size="11" font-weight="600">Fix: implement server-side</text>
  <text x="302" y="280" fill="#0F172A" font-size="11" font-weight="600">Conversions API (CAPI).</text>

  <!-- STEP 3 -->
  <rect x="540" y="96" width="228" height="192" rx="10" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="540" y="96" width="228" height="4" rx="2" fill="#DC2626"/>
  <text x="556" y="124" fill="#DC2626" font-size="10" font-weight="700" letter-spacing="1">STEP 3</text>
  <text x="556" y="144" fill="#0F172A" font-size="13" font-weight="700">Upload Offline</text>
  <text x="556" y="160" fill="#0F172A" font-size="13" font-weight="700">Conversion Data</text>

  <line x1="556" y1="172" x2="752" y2="172" stroke="#E2E8F0" stroke-width="1"/>

  <text x="556" y="191" fill="#475569" font-size="11">Send closed-won revenue</text>
  <text x="556" y="206" fill="#475569" font-size="11">data from CRM into Google</text>
  <text x="556" y="221" fill="#475569" font-size="11">Enhanced Conversions and</text>
  <text x="556" y="236" fill="#475569" font-size="11">Meta Offline Events API.</text>
  <text x="556" y="256" fill="#475569" font-size="11">Do this weekly minimum.</text>
  <text x="556" y="276" fill="#0F172A" font-size="11" font-weight="600">AI then optimizes toward</text>
  <text x="556" y="291" fill="#0F172A" font-size="11" font-weight="600">real revenue, not form fills.</text>

  <!-- CONNECTOR ARROWS -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748B"/>
    </marker>
  </defs>
  <line x1="262" y1="192" x2="283" y2="192" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="516" y1="192" x2="537" y2="192" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- OUTPUT SECTION -->
  <rect x="32" y="312" width="736" height="100" rx="10" fill="#0F172A" stroke="none"/>
  <text x="48" y="338" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1">BEFORE THE AUDIT</text>
  <text x="48" y="358" fill="#FFFFFF" font-size="12">AI optimizes toward form fills, surface-level events, platform-attributed conversions</text>
  <text x="48" y="376" fill="#64748B" font-size="12">AI has been learning from the wrong proxy since campaign launch</text>
  <text x="48" y="398" fill="#DC2626" font-size="10" font-weight="700" letter-spacing="1">AFTER THE AUDIT</text>
  <text x="48" y="396" fill="none">placeholder</text>

  <rect x="32" y="424" width="736" height="100" rx="10" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <rect x="32" y="424" width="736" height="4" rx="2" fill="#16A34A"/>
  <text x="48" y="452" fill="#16A34A" font-size="10" font-weight="700" letter-spacing="1">AFTER THE AUDIT</text>
  <text x="48" y="472" fill="#0F172A" font-size="12" font-weight="600">AI optimizes toward closed revenue, qualified pipeline, actual business outcomes</text>
  <text x="48" y="492" fill="#475569" font-size="12">Bidding adjusts to reach audiences statistically similar to closed customers, not just form submitters</text>

  <!-- Bottom note -->
  <text x="400" y="542" text-anchor="middle" fill="#94A3B8" font-size="10">Signal quality audit for AI paid ads optimization. Run quarterly minimum. Source: ANA, IAS, Adalysis (2025).</text>

</svg>
